<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mushaf</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mushaf">
<meta name="theme-color" content="#05070C">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<style>
:root{
  --ink0:#05070C; --ink1:#0A0F1A; --acc:#8AAEFF;
  --hair:rgba(255,255,255,.075); --glass:rgba(255,255,255,.042); --glassb:rgba(255,255,255,.085);
  --t1:#F3F5F9; --t2:rgba(255,255,255,.62); --t3:rgba(255,255,255,.42);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ar:"KFGQPC Uthman Taha Naskh","Amiri","Scheherazade New","Noto Naskh Arabic","Traditional Arabic",serif;
  --mini:64px;
}
*{box-sizing:border-box}
html{background:#05070C;height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;color:var(--t1);font-family:var(--font);font-size:17px;line-height:1.3;
  background:linear-gradient(180deg,#05070C 0%,#0A0F1A 100%);
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{appearance:none;-webkit-appearance:none;background:none;border:0;margin:0;padding:0;color:inherit;font:inherit;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:disabled{opacity:.4;cursor:default}
input{font:inherit;color:inherit}
.hidden{display:none !important}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
.light{font-weight:300}
.txtbtn{color:var(--acc);font-size:17px;padding:8px 0;min-height:44px;display:inline-flex;align-items:center}
.txtbtn:active{opacity:.55}
svg{display:block}

/* ---------- app frame ---------- */
#app{height:100%;display:flex;flex-direction:column;padding:var(--sat) var(--sar) 0 var(--sal)}
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 20px 6px;min-height:56px}
.top h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em}
.top .txtbtn{padding-bottom:6px}
.editbar{padding:6px 20px 12px;display:flex;justify-content:flex-start}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--glassb);border-radius:12px;padding:3px}
.seg button{padding:8px 16px;border-radius:9px;font-size:15px;color:var(--t2);min-height:36px}
.seg button.on{background:rgba(255,255,255,.1);color:var(--t1)}
.home{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 16px 0;overflow:hidden;overscroll-behavior:contain}
.home.editing{overflow-y:auto;-webkit-overflow-scrolling:touch}
.home.pad{padding-bottom:calc(var(--mini) + 28px + var(--sab))}
.home:not(.pad){padding-bottom:calc(16px + var(--sab))}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));gap:12px;position:relative}
.grid.four{grid-template-rows:repeat(2,minmax(0,1fr))}
.home.editing .grid{flex:none;grid-auto-rows:132px;grid-template-rows:repeat(3,132px)}
.home.editing .grid.four{grid-template-rows:repeat(2,132px)}

/* ---------- tiles ---------- */
.tile{position:relative;background:var(--glass);border:1px solid var(--glassb);border-radius:22px;padding:18px 18px 16px;
  display:flex;flex-direction:column;justify-content:space-between;min-height:0;overflow:hidden;
  transition:transform .22s cubic-bezier(.2,.8,.2,1),background .15s}
.tile:active{background:rgba(255,255,255,.075)}
.tile .name{font-size:22px;font-weight:500;letter-spacing:-.012em;line-height:1.15;padding-right:4px}
.tile .status{font-size:15px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:8px}
.tile .status .ar{font-size:19px;line-height:1}
.tile.slot{background:none;border:1px dashed var(--glassb);pointer-events:none}
.tile .rm,.tile .grip{position:absolute;top:10px;display:none;align-items:center;justify-content:center;width:34px;height:34px;color:var(--t2)}
.tile .rm{left:8px;border-radius:50%}
.tile .rm i{display:block;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);position:relative}
.tile .rm i:after{content:"";position:absolute;left:5px;right:5px;top:50%;height:1.5px;background:rgba(255,255,255,.9);transform:translateY(-50%)}
.tile .grip{right:8px}
.home.editing .tile .rm,.home.editing .tile .grip{display:flex}
.home.editing .tile{touch-action:none}
.home.editing .tile .name{padding-left:36px;padding-right:40px;font-size:19px}
.srow,.crow{cursor:pointer}
.jhead.empty span:last-child{color:var(--t3)}
.home.editing .tile .status{display:none}
.home.editing .tile.dragging{transition:none;z-index:5;background:rgba(255,255,255,.09);box-shadow:0 18px 48px rgba(0,0,0,.65)}
.more{padding:22px 0 12px}
.more h2{margin:0 4px 8px;font-size:15px;font-weight:500;color:var(--t2);letter-spacing:.02em;text-transform:uppercase}
.mrow{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 6px;border-top:1px solid var(--hair);width:100%}
.mrow:first-of-type{border-top:0}
.mrow .add{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none}
.mrow .add i{display:block;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--acc);position:relative}
.mrow .add i:before,.mrow .add i:after{content:"";position:absolute;background:var(--acc);left:50%;top:50%;transform:translate(-50%,-50%)}
.mrow .add i:before{width:10px;height:1.5px}.mrow .add i:after{width:1.5px;height:10px}
.mrow .mt{flex:1;min-width:0}.mrow .mt b{display:block;font-weight:500;font-size:17px}.mrow .mt span{display:block;font-size:15px;color:var(--t3);margin-top:2px}
.mrow.full{opacity:.45}
.hint{font-size:15px;color:var(--t3);padding:14px 6px 0}

/* ---------- mini player ---------- */
.mini{position:fixed;left:calc(12px + var(--sal));right:calc(12px + var(--sar));bottom:calc(12px + var(--sab));height:var(--mini);z-index:20;
  background:rgba(22,27,40,.92);border:1px solid var(--glassb);border-radius:18px;display:flex;align-items:center;padding:0 6px 0 18px;overflow:hidden;
  -webkit-backdrop-filter:saturate(140%) blur(18px);backdrop-filter:saturate(140%) blur(18px);
  transform:translateY(0);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s}
.mini.away{transform:translateY(140%);opacity:0;pointer-events:none}
.mini:active{background:rgba(30,36,52,.95)}
.mini .mp{position:absolute;left:0;right:0;top:0;height:2px;background:var(--hair)}
.mini .mp i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--acc)}
.mini .mt{flex:1;min-width:0}
.mini .mt b{display:block;font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mt span{display:block;font-size:15px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.mini .mt .ar{font-size:18px}
.mini .mb{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.mini .mb:active{background:rgba(255,255,255,.08)}
.mini .mb svg{width:26px;height:26px;fill:var(--t1)}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,0);transition:background .3s;pointer-events:none}
.sheet.show{background:rgba(0,0,0,.55);pointer-events:auto}
.sheet.z2{z-index:50}
.card{position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 40px);background:#0B101B;border:1px solid var(--glassb);border-bottom:0;border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.sheet.show .card{transform:translateY(0)}
.card .hd{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 4px;min-height:52px;flex:none}
.card .hd .ttl{font-size:17px;font-weight:600;position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.card .hd .r{min-width:56px;text-align:right}
.card .tools{padding:4px 16px 10px;display:flex;gap:10px;align-items:center;flex:none}
.card .tools input{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid var(--glassb);background:var(--glass);padding:0 14px;outline:none;font-size:17px;-webkit-appearance:none}
.card .tools input::placeholder{color:var(--t3)}
.card .tools input::-webkit-search-cancel-button{-webkit-appearance:none}
.card .tools .txtbtn{padding:0 4px;white-space:nowrap}
.body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 0 calc(24px + var(--sab))}
.jhead{position:sticky;top:0;z-index:1;background:#0B101B;padding:16px 20px 6px;font-size:15px;color:var(--t2);display:flex;justify-content:space-between}
.jhead.cur{color:var(--acc)}
.srow,.crow,.rrow{display:flex;align-items:center;gap:12px;width:100%;padding:0 12px 0 20px;min-height:60px;border-top:1px solid var(--hair);text-align:left}
.srow:active,.crow:active,.rrow:active,.arow:active{background:rgba(255,255,255,.05)}
.srow .sn{width:30px;flex:none;color:var(--t3);font-size:15px}
.srow .sname{flex:1;min-width:0;display:flex;align-items:baseline;gap:12px}
.srow .sname .ar{font-size:23px;line-height:1.1;flex:none}
.srow .sname .lat{font-size:16px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sname .lat small{font-size:15px;color:var(--t3)}
.srow .pg{color:var(--t3);font-size:15px;flex:none;width:34px;text-align:right}
.srow.cur .ar{color:var(--acc)}
.dl{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:50%}
.dl svg{width:20px;height:20px;stroke:var(--t3);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dl.done svg{stroke:var(--acc)}
.dl .pct{font-size:15px;color:var(--t2)}
.dl:active{background:rgba(255,255,255,.08)}
.crow .ct{flex:1;min-width:0}
.crow .ct b{display:block;font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .ct span{display:block;font-size:15px;color:var(--t2);margin-top:3px}
.crow .ct .ar{font-size:22px;margin-right:8px}
.crow.na .ct b{color:var(--t2)}
.crow.na .ct span{color:var(--t3)}
.rrow{flex-direction:column;align-items:stretch;gap:4px;padding:16px 20px}
.rrow b{font-size:20px;font-weight:500}
.rrow span{font-size:15px;color:var(--t2);line-height:1.35}
.rrow span em{font-style:normal;color:var(--t1)}
.agrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:8px 16px}
.arow{height:48px;border-radius:12px;background:var(--glass);border:1px solid var(--glassb);font-size:17px;display:flex;align-items:center;justify-content:center}
.arow.cur{background:var(--acc);color:#05070C;border-color:var(--acc);font-weight:600}
.subhd{padding:10px 20px 4px;font-size:15px;color:var(--t3)}

/* ---------- full player ---------- */
.player{position:fixed;inset:0;z-index:40;background:linear-gradient(180deg,#05070C 0%,#0A0F1A 100%);
  transform:translateY(102%);transition:transform .36s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  padding:var(--sat) var(--sar) 0 var(--sal)}
.player.show{transform:translateY(0)}
.grab{flex:none;height:44px;display:flex;align-items:center;justify-content:center;touch-action:none}
.grab i{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.28)}
.pbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 20px calc(28px + var(--sab));display:flex;flex-direction:column}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.ptitle{text-align:center;padding:2px 0 8px}
.ptitle .kicker{font-size:15px;color:var(--t2);letter-spacing:.06em;text-transform:uppercase}
.ptitle .big{font-size:36px;line-height:1.35}
.ptitle .sub{font-size:17px;color:var(--t2);margin-top:4px}
.ptitle .ar.sub{font-size:22px}
.txt{flex:1;min-height:120px;max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  display:flex;align-items:center;justify-content:center;padding:10px 4px;position:relative}
.txt .in{width:100%;text-align:center;font-size:33px;line-height:1.95;word-spacing:.08em;margin:auto}
.txt .in .w{color:var(--t1)}
.txt .in .w.on{color:var(--acc)}
.txt .in .aend{color:var(--t3);font-size:.7em;margin:0 .15em}
.txt.veil .in{visibility:hidden}
.txt .peek{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--t3);font-size:15px;font-family:var(--font);direction:ltr}
.txt.veil .peek{display:flex}
.meta{text-align:center;font-size:15px;color:var(--t2);min-height:20px;padding:4px 0 6px}
.meta .state{color:var(--t1)}
.prog{padding:14px 0 4px;touch-action:none}
.prog .bar{height:3px;border-radius:2px;background:var(--hair);position:relative}
.prog .bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:2px;background:var(--acc)}
.prog .times{display:flex;justify-content:space-between;font-size:15px;color:var(--t3);margin-top:8px}
.ctl{display:flex;align-items:center;justify-content:center;gap:26px;padding:12px 0 14px}
.skip{width:60px;height:60px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--t1);position:relative}
.skip:active{background:rgba(255,255,255,.08)}
.skip svg{width:32px;height:32px;fill:var(--t1)}
.skip small{position:absolute;font-size:13px;font-weight:500;top:50%;left:50%;transform:translate(-50%,-50%);letter-spacing:-.02em}
.skip.s15 svg{width:36px;height:36px;fill:none;stroke:var(--t1);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bigp{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--glassb);display:flex;align-items:center;justify-content:center}
.bigp:active{background:rgba(255,255,255,.14)}
.bigp svg{width:34px;height:34px;fill:var(--t1)}
.ring{width:96px;height:96px;position:relative;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ring:active .core{background:rgba(255,255,255,.12)}
.ring svg{position:absolute;inset:0;width:96px;height:96px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2.4}
.ring .track{stroke:var(--hair)}
.ring .fill{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:289.03;stroke-dashoffset:289.03}
.ring.wait .fill{stroke:var(--acc);opacity:.85}
.ring .core{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center}
.ring .core svg{position:static;width:32px;height:32px;fill:var(--t1);transform:none}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:2px 0 12px}
.chips.two{grid-template-columns:repeat(2,1fr)}
.chip{background:var(--glass);border:1px solid var(--glassb);border-radius:14px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 6px}
.chip:active{background:rgba(255,255,255,.09)}
.chip b{font-size:18px;font-weight:500;letter-spacing:-.01em}
.chip span{font-size:15px;color:var(--t3)}
.chip.acc b{color:var(--acc)}
.rowbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:0 14px;border-radius:14px;background:var(--glass);border:1px solid var(--glassb)}
.rowbtn:active{background:rgba(255,255,255,.09)}
.rowbtn span{color:var(--t2);font-size:16px}
.rowbtn b{flex:1;text-align:right;font-weight:500;font-size:17px}
.rowbtn b .ar{font-size:21px;margin-right:6px}
.rowbtn i{color:var(--t3);font-style:normal;font-size:22px;line-height:1}

/* ---------- toast + loading ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--mini) + 30px + var(--sab));transform:translate(-50%,20px);z-index:60;background:rgba(30,36,52,.96);border:1px solid var(--glassb);
  padding:12px 18px;border-radius:14px;font-size:15px;color:var(--t1);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.loading .tile{opacity:.55;pointer-events:none}
.boot{position:fixed;inset:0;z-index:70;background:#05070C;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:15px;transition:opacity .3s}
.boot.gone{opacity:0;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{transition-duration:0s !important;animation:none !important}
}
@media (max-height:700px){
  .txt .in{font-size:29px}
  .ptitle .big{font-size:31px}
  .home.editing .grid{grid-auto-rows:112px;grid-template-rows:repeat(3,112px)}
}
</style>
</head>
<body>
<div id="boot" class="boot">Loading…</div>
<div id="app">
  <header class="top">
    <h1>Mushaf</h1>
    <button id="editBtn" class="txtbtn" aria-label="Edit tiles">Edit</button>
  </header>
  <div id="editBar" class="editbar hidden">
    <div class="seg" id="sizeSeg" role="radiogroup" aria-label="Grid size">
      <button data-size="4" role="radio">4 tiles</button><button data-size="6" role="radio">6 tiles</button>
    </div>
  </div>
  <main id="home" class="home">
    <div id="grid" class="grid" role="list"></div>
    <section id="more" class="more hidden">
      <h2>More tiles</h2>
      <div id="moreList"></div>
    </section>
  </main>
</div>

<div id="mini" class="mini away" role="button" aria-label="Now playing">
  <div class="mp"><i id="miniFill"></i></div>
  <div class="mt"><b id="miniTitle"></b><span id="miniSub" class="num"></span></div>
  <button id="miniPlay" class="mb" aria-label="Play or pause"></button>
</div>

<div id="sheetA" class="sheet"><div class="card">
  <div class="hd"><button class="txtbtn close">Close</button><div class="ttl"></div><div class="r"></div></div>
  <div class="tools hidden"></div>
  <div class="body"></div>
</div></div>
<div id="sheetB" class="sheet z2"><div class="card">
  <div class="hd"><button class="txtbtn close">Close</button><div class="ttl"></div><div class="r"></div></div>
  <div class="tools hidden"></div>
  <div class="body"></div>
</div></div>

<div id="player" class="player" aria-label="Player">
  <div class="grab" id="grab" role="button" aria-label="Close player"><i></i></div>
  <div class="pbody" id="pbody">

    <section id="lv" class="view hidden">
      <div class="ptitle"><div class="big ar" id="lvAr"></div><div class="sub" id="lvSub"></div></div>
      <div class="txt" id="lvTxt"><div class="in ar" id="lvText"></div></div>
      <div class="meta num" id="lvMeta"></div>
      <div class="prog" id="lvProg"><div class="bar"><i id="lvFill"></i></div><div class="times num"><span id="lvT0">0:00</span><span id="lvT1">0:00</span></div></div>
      <div class="ctl">
        <button id="lvPrev" class="skip" aria-label="Previous"></button>
        <button id="lvPlay" class="bigp" aria-label="Play or pause"></button>
        <button id="lvNext" class="skip" aria-label="Next"></button>
      </div>
      <div class="chips two">
        <button class="chip" id="lvSpeed"><b class="num">1×</b><span>Speed</span></button>
        <button class="chip" id="lvDl"><b>Download</b><span>Offline</span></button>
      </div>
    </section>

    <section id="mv" class="view hidden">
      <div class="ptitle"><div class="kicker">Memorise</div><div class="sub num" id="mvWhere"></div></div>
      <div class="txt" id="mvTxt"><div class="in ar" id="mvText"></div><div class="peek">Tap to peek</div></div>
      <div class="meta num" id="mvStatus"></div>
      <div class="ctl">
        <button id="mvPrev" class="skip" aria-label="Previous block"></button>
        <button id="mvPlay" class="ring" aria-label="Play or pause">
          <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="46"/><circle class="fill" id="ringFill" cx="50" cy="50" r="46"/></svg>
          <span class="core" id="mvGlyph"></span>
        </button>
        <button id="mvNext" class="skip" aria-label="Next block"></button>
      </div>
      <div class="chips" id="mvChips">

/* @@PLAN-BEGIN */
// Pure block planning. No DOM. Extracted verbatim by test/plan-test.js.
// Inputs: T = timings entry for one surah { url, d, v:[[fromMs,toMs,[[pos,startMs,endMs],..]],..] }
//         W = words for that surah [[word,..],..]   (positions are 1-based into these arrays)
// Output: array of blocks { s, a1, a2, from, to, dur, kind:'ayah'|'words', spans:[{a,p1,p2}], k, n }
//   from/to are ms in the surah file; spans are the words to display (p1..p2 inclusive, per ayah).
var MushafPlan = (function () {
  var MARK = /[ۖ-ۜ۞]/;                 // pause marks (U+06D6..U+06DC, U+06DE), attached to the word they follow
  var AUTO = { lo: 8, hi: 14, min: 4, max: 18, split: 16, mid: 10.5 };   // seconds at 1x: the Auto thresholds
  var WORDS = { target: 6, lo: 4, hi: 7, tailMin: 3 };                // Words mode: ~5-6 words, cut window 4-7

  function ayahDur(v, i) { return (v[i][1] - v[i][0]) / 1000; }

  // Time-ordered word units of one ayah. Consecutive segments with the same position are one word
  // (the data splits some words in two); a segment at nw+1 is the ayah-end sign -> tail of the last word.
  // Units tile the ayah's [from,to] exactly (inter-word silence belongs to the preceding word), so any
  // cut between units is a cut at a word boundary of the timing data.
  function units(ayah, words) {
    var nw = words.length, segs = ayah[2].slice().sort(function (a, b) { return a[1] - b[1]; });
    var out = [], i, p, last, st, en;

      st = Math.max(segs[i][1], ayah[0]); en = Math.min(segs[i][2], ayah[1]);
      if (en <= st) continue;
      p = segs[i][0]; if (p > nw) p = nw; if (p < 1) p = 1;
      last = out[out.length - 1];
      // same position twice in a row is one word split in two, unless the union is longer than any
      // word can be (then it is the teacher repeating, and stays a separate unit)
      if (last && last.p === p && en - last.start <= 12000) { last.end = Math.max(last.end, en); continue; }
      out.push({ p: p, start: st, end: en });
    }
    if (!out.length) out.push({ p: 1, start: ayah[0], end: ayah[1] });
    out[0].start = ayah[0];
    for (i = 0; i < out.length - 1; i++) out[i].end = out[i + 1].start;
    out[out.length - 1].end = ayah[1];
    for (i = 0; i < out.length; i++) {
      out[i].dur = (out[i].end - out[i].start) / 1000;
      out[i].mark = MARK.test(words[out[i].p - 1] || '');
    }
    return out;
  }
  function sumDur(us, a, b) { var d = 0; for (var i = a; i < b; i++) d += us[i].dur; return d; }

  // Turn unit runs into word blocks; display spans are position ranges, widened so that every word
  // of the ayah is shown in some block even where the audio repeats a phrase or a word has no segment.
  function runsToBlocks(s, a, us, cuts, nw) {
    var blocks = [], i, j, lo, hi, run, k;
    for (i = 0; i < cuts.length - 1; i++) {
      run = us.slice(cuts[i], cuts[i + 1]);
      lo = Infinity; hi = -Infinity;
      for (j = 0; j < run.length; j++) { if (run[j].p < lo) lo = run[j].p; if (run[j].p > hi) hi = run[j].p; }
      blocks.push({ s: s, a1: a, a2: a, from: run[0].start, to: run[run.length - 1].end, kind: 'words', lo: lo, hi: hi });
    }
    blocks[0].lo = 1; blocks[blocks.length - 1].hi = nw;
    for (i = 0; i < blocks.length - 1; i++) if (blocks[i + 1].lo > blocks[i].hi + 1) blocks[i].hi = blocks[i + 1].lo - 1;
    for (k = 0; k < blocks.length; k++) {
      var b = blocks[k];
      b.dur = (b.to - b.from) / 1000; b.spans = [{ a: a, p1: b.lo, p2: b.hi }]; b.k = k + 1; b.n = blocks.length;
      delete b.lo; delete b.hi;
    }
    return blocks;
  }

  // Auto split of one long ayah: 8-14 s blocks, cut at the last pause mark inside that window,
  // otherwise at ~10.5 s; never above 18 s, never a tail shorter than 4 s.
  function splitByTime(s, a, ayah, words) {
    var us = units(ayah, words), n = us.length, cuts = [0], i = 0, j, dur, d, markCut, midCut, c, rem, bd, k, prev, cur, next;
    while (i < n) {
      dur = 0; j = i; markCut = -1; midCut = -1;
      while (j < n) {
        d = us[j].dur;
        if (dur > 0 && dur + d > AUTO.max) break;        // never let a block pass 18 s
        dur += d; j++;
        if (dur >= AUTO.lo && us[j - 1].mark) markCut = j;
        if (midCut < 0 && dur >= AUTO.mid) midCut = j;
        if (dur >= AUTO.hi) break;
      }
      c = markCut > 0 ? markCut : (midCut > 0 ? midCut : j);
      rem = sumDur(us, c, n);
      if (rem > 0 && rem < AUTO.min) {                   // never leave a tail shorter than 4 s
        bd = sumDur(us, i, c);
        if (bd + rem <= AUTO.max) c = n;
        else while (c > i + 1 && sumDur(us, c, n) < AUTO.min) c--;
      }
      cuts.push(c); i = c;
    }
    // a run under 4 s (a very short word before an 18 s unit, say) joins a neighbour when that stays <= 18 s
    for (k = 1; k < cuts.length; k++) {
      cur = sumDur(us, cuts[k - 1], cuts[k]);
      if (cur >= AUTO.min) continue;
      prev = k > 1 ? sumDur(us, cuts[k - 2], cuts[k - 1]) : Infinity;
      next = k < cuts.length - 1 ? sumDur(us, cuts[k], cuts[k + 1]) : Infinity;
      if (prev + cur <= AUTO.max && prev <= next) { cuts.splice(k - 1, 1); k--; }
      else if (next + cur <= AUTO.max) { cuts.splice(k, 1); k--; }
    }
    return runsToBlocks(s, a, us, cuts, words.length);
  }

  // Words mode: ~5-6 audible words per block, cut after a pause mark when one falls in the 4-7 window.
  function splitByCount(s, a, ayah, words) {
    var us = units(ayah, words), n = us.length, cuts = [0], i = 0, c, best, q;
    if (n <= WORDS.hi) return [{ s: s, a1: a, a2: a, from: ayah[0], to: ayah[1], dur: (ayah[1] - ayah[0]) / 1000, kind: 'words', spans: [{ a: a, p1: 1, p2: words.length }], k: 1, n: 1 }];
    while (i < n) {
      if (n - i <= WORDS.hi) { cuts.push(n); break; }
      best = -1;
      for (q = WORDS.lo; q <= WORDS.hi; q++) if (us[i + q - 1].mark && (best < 0 || Math.abs(q - WORDS.target) < Math.abs(best - WORDS.target))) best = q;
      c = i + (best > 0 ? best : WORDS.target);
      if (n - c < WORDS.tailMin) c = n - WORDS.tailMin;
      cuts.push(c); i = c;
    }
    return runsToBlocks(s, a, us, cuts, words.length);
  }

  function ayahBlock(s, v, i, W) {
    return { s: s, a1: i + 1, a2: i + 1, from: v[i][0], to: v[i][1], dur: ayahDur(v, i), kind: 'ayah', spans: [{ a: i + 1, p1: 1, p2: W[i].length }], k: 1, n: 1 };
  }
  function merge(s, v, i0, i1, W) {   // ayat i0..i1 inclusive (0-based) as one block
    var b = { s: s, a1: i0 + 1, a2: i1 + 1, from: v[i0][0], to: v[i1][1], kind: 'ayah', spans: [], k: 1, n: 1 };
    for (var i = i0; i <= i1; i++) b.spans.push({ a: i + 1, p1: 1, p2: W[i].length });
    b.dur = (b.to - b.from) / 1000;
    return b;
  }

  // mode: 'ayah' | '2' | '3' | 'words' | 'auto'.  fromAyah is 1-based; blocks cover fromAyah..last ayah of surah s.
  function planBlocks(s, T, W, mode, fromAyah) {
    var v = T.v, nA = v.length, start = Math.max(1, Math.min(fromAyah || 1, nA)) - 1, out = [], i, g, d, k;
    if (mode === '2' || mode === '3') {

      for (i = start; i < nA; i += g) out.push(merge(s, v, i, Math.min(i + g - 1, nA - 1), W));
      return out;
    }
    if (mode === 'words') {
      for (i = start; i < nA; i++) out = out.concat(splitByCount(s, i + 1, v[i], W[i]));
      return out;
    }
    if (mode === 'auto') {
      i = start;
      while (i < nA) {
        d = ayahDur(v, i);
        if (d > AUTO.split) { out = out.concat(splitByTime(s, i + 1, v[i], W[i])); i++; continue; }
        k = i + 1;
        while (d < AUTO.lo && k < nA && ayahDur(v, k) <= AUTO.split && d + ayahDur(v, k) <= AUTO.hi) { d += ayahDur(v, k); k++; }
        out.push(k - 1 === i ? ayahBlock(s, v, i, W) : merge(s, v, i, k - 1, W));
        i = k;
      }
      // a leftover short block (< 4 s) joins a neighbouring whole-ayah block when that stays <= 18 s
      for (i = 0; i < out.length; i++) {
        if (out[i].dur >= AUTO.min) continue;
        if (i > 0 && out[i - 1].kind === 'ayah' && out[i - 1].dur + out[i].dur <= AUTO.max) { out.splice(i - 1, 2, merge(s, v, out[i - 1].a1 - 1, out[i].a2 - 1, W)); i--; }
        else if (i < out.length - 1 && out[i + 1].kind === 'ayah' && out[i + 1].dur + out[i].dur <= AUTO.max) { out.splice(i, 2, merge(s, v, out[i].a1 - 1, out[i + 1].a2 - 1, W)); i--; }
      }
      return out;
    }
    for (i = start; i < nA; i++) out.push(ayahBlock(s, v, i, W));
    return out;
  }

  // Word currently sounding in ayah a at ms: {a, p} or null. Uses raw segments (time order) so a
  // repeated phrase in the recording lights the right word both times.
  function wordAt(T, W, a, ms) {
    var ayah = T.v[a - 1]; if (!ayah) return null;
    var segs = ayah[2], i, best = null;
    for (i = 0; i < segs.length; i++) if (segs[i][1] <= ms && ms < segs[i][2]) { best = segs[i]; break; }
    if (!best) { for (i = 0; i < segs.length; i++) if (segs[i][1] <= ms && (!best || segs[i][1] > best[1])) best = segs[i]; }
    if (!best) return null;
    var p = best[0]; if (p > W[a - 1].length) p = W[a - 1].length;

  function ayahAt(T, ms) {
    var v = T.v, lo = 0, hi = v.length - 1, m;
    while (lo <= hi) { m = (lo + hi) >> 1; if (ms < v[m][0]) hi = m - 1; else if (ms >= v[m][1]) lo = m + 1; else return m + 1; }

})();

    var rows = D.meta.surahs.filter(function (su) { return su.juz === j; }), st = parseRef(D.meta.juzStarts[j - 1]);
    // every juz gets its header; a juz that begins mid-surah says so on the right (juz 2 and 3 are all Al-Baqarah)
    var note = st.a === 1 ? '' : esc(surah(st.s).name) + (rows.length ? ' ' : ' continues ') + 'from ' + D.meta.juzStarts[j - 1];
    html += '<div class="jhead num' + (j === cur ? ' cur' : '') + (rows.length ? '' : ' empty') + '" id="' + opts.prefix + 'jz' + j + '" data-juz="' + j + '"><span>Juz ' + j + '</span><span>' + note + '</span></div>';
    rows.forEach(function (su) { html += surahRowHTML(su, opts); });
  }
  return html;
}
function wireSurahList(sheet, opts) {
  var input = qs('input', sheet.tools), jump = qs('[data-jump]', sheet.tools), body = sheet.body;
  if (input) on(input, 'input', function () {
    var q = input.value.trim().toLowerCase();
    qsa('.srow', body).forEach(function (r) { r.classList.toggle('hidden', !!q && r.getAttribute('data-q').indexOf(q) < 0); });
    qsa('.jhead', body).forEach(function (h) { var n = h.nextElementSibling, any = false; while (n && !n.classList.contains('jhead')) { if (!n.classList.contains('hidden')) any = true; n = n.nextElementSibling; } h.classList.toggle('hidden', !!q && !any); });
  });
  if (jump) on(jump, 'click', function () { if (input) { input.value = ''; input.dispatchEvent(new Event('input')); } var h = $(opts.prefix + 'jz' + juzOf(S.pos.s, S.pos.a)); if (h) body.scrollTop = h.offsetTop - body.offsetTop; });
  on(body, 'click', function (e) {
    var dl = e.target.closest('.dl[data-url]'); if (dl) { e.stopPropagation(); DL.download(dl.getAttribute('data-url')); return; }
    var row = e.target.closest('.srow[data-n]'); if (row) opts.onPick(+row.getAttribute('data-n'));
  });
}
function showSurahPicker(opts) {
  opts.prefix = 'a'; var tools = '<input type="search" placeholder="Search surah" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="search"><button class="txtbtn" data-jump>Juz ' + juzOf(S.pos.s, S.pos.a) + '</button>';
  sheetA.show(opts.title, surahListHTML(opts), tools);
  wireSurahList(sheetA, opts);
}

/* ---------- revision ---------- */
function revisionChoices() {
  var P = pageOf(S.pos.s, S.pos.a), P2 = Math.min(P + 4, 604), pos = { s: S.pos.s, a: S.pos.a }, su = surah(S.pos.s), J = juzOf(S.pos.s, S.pos.a);
  return [
    { id: 'pages', name: 'Last 5 pages', def: 'From the first ayah of page <em>' + P + '</em> to the end of page <em>' + P2 + '</em>', from: pageStart(P), to: pageEnd(P2) },
    { id: 'surah', name: 'Last surah', def: 'All of <em>' + esc(su.name) + '</em> (' + su.n + '), ' + su.ayahs + ' ayat', from: { s: su.n, a: 1 }, to: { s: su.n, a: su.ayahs } },
    { id: 'juz', name: 'Last juz', def: 'From <em>' + refStr(pos) + '</em> to the end of Juz <em>' + J + '</em> (' + refStr(juzEnd(J)) + ')', from: pos, to: juzEnd(J) },
    { id: 'all', name: 'Everything', def: 'From <em>' + refStr(pos) + '</em> to <em>114:6</em> — all you have memorised', from: pos, to: { s: 114, a: 6 } }
  ];
}
function showRevision() {
  var ch = revisionChoices(), html = '';
  ch.forEach(function (c) { html += '<button class="rrow" data-rev="' + c.id + '"><b>' + c.name + '</b><span class="num">' + c.def + '</span></button>'; });
  html += '<div class="hint" style="padding:16px 20px 0">Continuous Husary, no pauses, at the Quran speed. Your position is ' + refStr(S.pos) + '.</div>';
  sheetA.show('Revise', html);
  on(sheetA.body, 'click', function (e) {
    var b = e.target.closest('[data-rev]'); if (!b) return;
    var c = revisionChoices().filter(function (x) { return x.id === b.getAttribute('data-rev'); })[0];
    var ranges = rangesBetween(c.from, c.to); if (!ranges.length) { toast('Nothing in that range'); return; }
    sheetA.hide();
    Listen.start({ kind: 'quran', source: 'murattal', ranges: ranges, title: c.name, sub: 'Revise · ' + c.name.toLowerCase(), remember: false, tile: 'revise', recent: c.name });
    Deck.show();
  });
}

/* ---------- collections + reciters ---------- */
function showCollection(kind) {
  var c = D.content[kind], html = '';
  if (!c) { toast('No manifest for ' + KIND[kind].name); return; }
  c.items.forEach(function (it) {
    var na = !it.url, res = S.resume['c:' + it.id], sub = na ? 'Not yet available' : (res > 5 ? 'Resume at ' + fmtTime(res) : (it.duration ? fmtTime(it.duration) : 'Not played yet'));
    html += '<div class="crow' + (na ? ' na' : '') + '" role="button" tabindex="0" data-item="' + esc(it.id) + '"><span class="ct"><b>' + esc(it.title) + '</b><span class="num">' + sub + '</span></span>' + dlButton(it.url) + '</div>';
  });
  if (!c.items.length) html = '<div class="hint">Nothing here yet.</div>';
  sheetA.show(c.title || KIND[kind].name, html);
  on(sheetA.body, 'click', function (e) {
    var dl = e.target.closest('.dl[data-url]'); if (dl) { e.stopPropagation(); DL.download(dl.getAttribute('data-url')); return; }
    var row = e.target.closest('[data-item]'); if (!row) return;
    var it = c.items.filter(function (x) { return x.id === row.getAttribute('data-item'); })[0];
    if (!it || !it.url) { toast('Not yet available — no file for this item'); return; }
    sheetA.hide();
    Listen.start({ kind: 'file', url: it.url, title: it.title, sub: c.title, key: 'c:' + it.id, speedSet: 'l', tile: kind, recent: it.title, duration: it.duration || 0, meta: c.title });
    Deck.show();
  });
}
function showReciters() {
  var c = D.content.reciters, html = '';
  if (!c) { toast('No reciters manifest'); return; }
  c.items.forEach(function (it) {
    var su = it.surah ? surah(it.surah) : null, res = S.resume['r:' + it.id];
    html += '<div class="crow" role="button" tabindex="0" data-item="' + esc(it.id) + '"><span class="ct"><b>' + (su ? '<span class="ar">' + esc(su.arabic) + '</span>' : '') + esc(it.title) + '</b><span class="num">' + esc(it.reciter || '') + (res > 5 ? ' · resume at ' + fmtTime(res) : '') + '</span></span>' + dlButton(it.url) + '</div>';
  });
  sheetA.show(c.title || 'Recitations', html);
  on(sheetA.body, 'click', function (e) {
    var dl = e.target.closest('.dl[data-url]'); if (dl) { e.stopPropagation(); DL.download(dl.getAttribute('data-url')); return; }
    var row = e.target.closest('[data-item]'); if (!row) return;
    var it = c.items.filter(function (x) { return x.id === row.getAttribute('data-item'); })[0]; if (!it || !it.url) return;
    var su = it.surah ? surah(it.surah) : null;
    sheetA.hide();
    Listen.start({ kind: 'file', url: it.url, title: it.title, arTitle: su ? su.arabic : '', sub: it.reciter || '', key: 'r:' + it.id, speedSet: 'q', tile: 'reciters', recent: it.title + ' · ' + (it.reciter || '').split(' ').slice(-1)[0], meta: su ? su.name + ' · ' + su.ayahs + ' ayat · Page ' + su.page : '' });
    Deck.show();
  });
}

/* ---------- position picker: surah list, then the ayah number ---------- */
function showPositionPicker() {
  var opts = { prefix: 'b', cur: S.pos.s, dl: false, onPick: function (n) { showAyahGrid(n); } };
  var tools = '<input type="search" placeholder="Search surah" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="search"><button class="txtbtn" data-jump>Juz ' + juzOf(S.pos.s, S.pos.a) + '</button>';
  sheetB.show('I am learning', surahListHTML(opts), tools);
  wireSurahList(sheetB, opts);
  var cur = qs('.srow.cur', sheetB.body); if (cur) sheetB.body.scrollTop = Math.max(0, cur.offsetTop - sheetB.body.offsetTop - 120);
  function showAyahGrid(n) {
    var su = surah(n), html = '<div class="subhd"><span class="ar" style="font-size:22px">' + esc(su.arabic) + '</span> &nbsp;' + esc(su.name) + ' · choose the ayah</div><div class="agrid num">', a;
    for (a = 1; a <= su.ayahs; a++) html += '<button class="arow' + (n === S.pos.s && a === S.pos.a ? ' cur' : '') + '" data-a="' + a + '">' + a + '</button>';
    html += '</div>';
    sheetB.ttl.textContent = 'I am learning'; sheetB.tools.classList.add('hidden'); sheetB.body.innerHTML = html; sheetB.body.scrollTop = 0;
    sheetB.right.innerHTML = '<button class="txtbtn" data-back>Surahs</button>';
    on(qs('[data-back]', sheetB.right), 'click', function () { showPositionPicker(); });
    var c = qs('.arow.cur', sheetB.body); if (c) sheetB.body.scrollTop = Math.max(0, c.offsetTop - sheetB.body.offsetTop - 160);
    on(sheetB.body, 'click', function (e) { var b = e.target.closest('.arow[data-a]'); if (!b) return; sheetB.hide(); Memo.setPosition(n, +b.getAttribute('data-a')); });
  }
}

/* ===================== Downloads into Cache Storage (the service worker answers from it) ===================== */
var DL = {
  have: {}, prog: {},
  init: function () {
    if (!('caches' in window)) return;
    caches.open(AUDIO_CACHE).then(function (c) { return c.keys(); }).then(function (reqs) { reqs.forEach(function (r) { DL.have[r.url] = 1; }); DL.refresh(); }).catch(noop);
  },
  state: function (url) { if (DL.have[url]) return 'done'; if (url in DL.prog) return DL.prog[url]; return 'none'; },
  refresh: function () {
    qsa('.dl[data-url]').forEach(function (b) { var st = DL.state(b.getAttribute('data-url')); b.classList.toggle('done', st === 'done'); setHTML(b, st === 'done' ? ICON.check : st !== 'none' ? '<span class="pct num">' + st + '%</span>' : ICON.dl); });
    Deck.render(true);
  },
  download: function (url) {
    if (!('caches' in window)) { toast('Offline storage is not available here'); return; }
    if (DL.have[url]) { toast('Already saved for offline'); return; }
    if (url in DL.prog) return;
    DL.prog[url] = 0; DL.refresh();
    fetch(url, { mode: 'cors' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var total = +res.headers.get('Content-Length') || 0, got = 0, chunks = [], reader = res.body.getReader();
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          chunks.push(r.value); got += r.value.length;
          var pct = total ? Math.min(99, Math.floor(got / total * 100)) : 0;
          if (pct !== DL.prog[url]) { DL.prog[url] = pct; DL.refresh(); }
          return pump();
        });
      }
      return pump().then(function () {
        var blob = new Blob(chunks, { type: 'audio/mpeg' });
        var headers = { 'Content-Type': 'audio/mpeg', 'Content-Length': String(blob.size), 'Accept-Ranges': 'bytes', 'X-Mushaf-Cached': '1' };
        return caches.open(AUDIO_CACHE).then(function (c) { return c.put(url, new Response(blob, { status: 200, headers: headers })); });
      });
    }).then(function () { delete DL.prog[url]; DL.have[url] = 1; DL.refresh(); toast('Saved for offline'); },
      function (e) { delete DL.prog[url]; DL.refresh(); toast('Download failed — ' + (e && e.message ? e.message : 'try again')); });
  }
};

/* ===================== tile actions ===================== */
function playHusaryFrom(n) {
  var ranges = [], s; for (s = n; s <= 114; s++) ranges.push({ s: s, a1: 1, a2: surah(s).ayahs });
  Listen.start({ kind: 'quran', source: 'murattal', ranges: ranges, title: surah(n).name, remember: true, tile: 'husary', recent: { s: n, a: 1 } }, { startSec: S.resume['q:' + n] });
  Deck.show();
}
var Actions = {
  memorize: function () { Memo.start(); Deck.show(); },
  revise: function () { showRevision(); },
  husary: function () { showSurahPicker({ title: 'Quran · Husary', dl: true, cur: S.recent.husary && S.recent.husary.s, onPick: function (n) { sheetA.hide(); playHusaryFrom(n); } }); },
  reciters: function () { showReciters(); },
  sharh: function () { showCollection('sharh'); },
  hadith: function () { showCollection('hadith'); },
  podcasts: function () { showCollection('podcasts'); }
};

/* ===================== boot ===================== */
function boot() {
  document.body.classList.add('loading');
  Home.init(); Deck.init(); Home.render();
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(noop); }
  loadData().then(function () {
    document.body.classList.remove('loading');
    $('boot').classList.add('gone');
    Home.render(); Deck.render(true); DL.init(); MediaSess.init();
    if (S.memo.source === 'muallim') ensureTimings('muallim').catch(noop);
  }, function (err) {
    $('boot').textContent = 'Could not load the Quran data. Check the connection and open the app again.';
    if (window.console) console.error(err);
  });
}
boot();
