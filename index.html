<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mushaf</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mushaf">
<meta name="theme-color" content="#05070C">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
:root{
  --ink0:#05070C; --ink1:#0A0F1A;
  --text:#F2F4F8; --dim:rgba(255,255,255,.46); --faint:rgba(255,255,255,.26);
  --hair:rgba(255,255,255,.075); --accent:#8AAEFF;
  --pill:rgba(138,174,255,.13); --pillb:rgba(138,174,255,.32);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --quran:"KFGQPC Uthman Taha Naskh","Amiri","Scheherazade New","Noto Naskh Arabic",serif;
  --pad:20px; --mini:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#05070C;height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%;color-scheme:dark}
/* scrollbars: on a laptop the browser's default is a white bar down the side of every list */
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24)}
/* position:fixed + inset 0 (A's approach): iOS 15 has no overscroll-behavior, so the page itself cannot rubber-band */
body{margin:0;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100vh;height:100dvh;overflow:hidden;
  background:linear-gradient(180deg,#05070C 0%,#0A0F1A 100%);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.3;
  touch-action:manipulation;-webkit-font-smoothing:antialiased;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;text-align:inherit}
button:disabled{cursor:default}
input{font:inherit;color:inherit;background:none;border:0;outline:none;-webkit-appearance:none;border-radius:0;-webkit-user-select:text;user-select:text}
input::-webkit-search-cancel-button,input::-webkit-search-decoration{-webkit-appearance:none;display:none}
svg{display:block}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.ar{font-family:var(--quran);direction:rtl;unicode-bidi:isolate}
.hide{display:none!important}
/* dim-white text buttons: Edit / Back / Close / Juz jump are never the accent */
.txtbtn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:0 4px;color:var(--dim);font-size:17px}
.txtbtn:active{color:var(--text)}

/* ---------------- home ---------------- */
#app{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;
  padding:var(--sat) var(--sar) 0 var(--sal)}
.bar{flex:none;display:flex;align-items:center;justify-content:flex-end;height:44px;
  padding:0 calc(12px + var(--sar)) 0 calc(var(--pad) + var(--sal))}
.htitle{flex:none;padding:0 calc(var(--pad) + var(--sar)) 12px calc(var(--pad) + var(--sal))}
.htitle h1{margin:0;font-size:34px;font-weight:300;letter-spacing:-.02em;line-height:1.15}
#homeBody{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  padding:0 calc(var(--pad) + var(--sar)) 0 calc(var(--pad) + var(--sal))}
#homeBody.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(28px + var(--sab))}
#homeBody.pad{padding-bottom:calc(var(--mini) + 10px + var(--sab))}
#homeBody:not(.pad):not(.scroll){padding-bottom:calc(10px + var(--sab))}

/* typographic grid: hairlines only, one big light name, one dim status */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr))}
.grid.four{grid-template-rows:repeat(2,minmax(0,1fr))}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;
  min-width:0;min-height:0;padding:18px 16px 20px 0;border-top:1px solid var(--hair)}
.tile:nth-child(odd){border-right:1px solid var(--hair)}
.tile:nth-child(even){padding-left:20px;padding-right:0}
.tile:nth-child(-n+2){border-top:0}
.tile .name{position:relative;z-index:1;font-size:26px;font-weight:300;letter-spacing:-.02em;line-height:1.14;text-align:left;max-width:100%}
.tile .status{position:relative;z-index:1;margin-top:7px;font-size:15px;line-height:1.45;color:var(--dim);max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tile .status .ar{font-size:17px;line-height:1.45}
/* a status made of a name that may be cut and a reference that never is */
.tile .status.split{display:flex;align-items:baseline;overflow:visible}
.tile .status.split .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .status.split .rf{flex:none;margin-left:7px;white-space:nowrap}
/* the one accent on the home: the prayer app's pill on the cell whose content is playing.
   Both columns get the same 8px between the pill's edge and the text; the bleed past the tile
   box is why .tile cannot clip (the names wrap, they never overflow). */
.tile.playing:before{content:"";position:absolute;left:-8px;right:8px;top:6px;bottom:6px;z-index:0;
  background:var(--pill);border:1px solid var(--pillb);border-radius:14px}
.tile:nth-child(even):before{left:12px;right:-8px}
.tile.playing .status{color:var(--accent)}
.tile.blank{pointer-events:none}
.tile .tap{position:absolute;left:0;top:0;right:0;bottom:0;z-index:2}
.tile .tap:active + .name{opacity:.55}
.tile .chev{position:absolute;z-index:3;top:2px;right:2px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.tile .chev:active{color:var(--text)}
.tile .chev svg{width:9px;height:16px}

/* ---------------- edit mode: Control-Center style list ---------------- */
.sizerow{display:flex;align-items:center;justify-content:space-between;min-height:56px;border-bottom:1px solid var(--hair)}
.sizerow .lbl{font-size:17px}
.seg{display:flex}
.seg button{min-width:52px;min-height:44px;padding:0 16px;color:var(--dim);font-size:17px;text-align:center;font-variant-numeric:tabular-nums}
.seg button.on{color:var(--accent)}
.seg button + button{border-left:1px solid var(--hair)}
.sect{margin:28px 0 2px;font-size:15px;color:var(--dim);letter-spacing:.01em}
.elist{position:relative}
.erow{display:flex;align-items:center;height:56px;border-bottom:1px solid var(--hair);background:transparent}
.elist.drag .erow{position:absolute;left:0;right:0;top:0;transition:transform .18s ease;background:#070B13}
.erow.lift{transition:none!important;z-index:2;background:#0A0F1A;border-top:1px solid var(--hair)}
.erow .pm{flex:none;width:44px;height:56px;display:flex;align-items:center;color:var(--dim)}
.erow .pm:disabled{opacity:.3}
.erow .nm{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .hd{flex:none;width:44px;height:56px;display:flex;align-items:center;justify-content:flex-end;color:var(--dim);touch-action:none}
.hint{margin-top:20px;font-size:15px;color:var(--faint);line-height:1.45}

/* ---------------- mini player, docked ---------------- */
.mini{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--mini) + var(--sab));
  padding:0 calc(10px + var(--sar)) var(--sab) calc(var(--pad) + var(--sal));
  background:#070B13;border-top:1px solid var(--hair);display:flex;align-items:center;
  transform:translateY(0);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.mini.away{transform:translateY(120%);pointer-events:none}
.mini .mp{position:absolute;left:0;right:0;top:0;height:2px;background:transparent}
.mini .mp i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
.mini .mt{flex:1;min-width:0;padding-right:10px}
.mini .mt b{display:block;font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mt span{display:block;font-size:15px;line-height:1.4;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums}
.mini .mt .ar{font-size:17px}
.mini .expand{position:absolute;left:0;top:0;right:60px;bottom:0}
.mini .mb{position:relative;z-index:2;width:56px;height:56px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--text)}
.mini .mb:active{opacity:.5}
.mini .mb svg{width:28px;height:28px}

/* ---------------- sheets ---------------- */
.sheet{position:fixed;left:0;top:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,0);transition:background .3s;pointer-events:none}
.sheet.show{background:rgba(0,0,0,.5);pointer-events:auto}
.sheet.z2{z-index:50}
.card{position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 30px);background:#070B13;border-top:1px solid var(--hair);
  display:flex;flex-direction:column;transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.sheet.show .card{transform:translateY(0)}
.card .hd{flex:none;display:flex;align-items:center;justify-content:space-between;height:44px;
  padding:0 calc(12px + var(--sar)) 0 calc(var(--pad) + var(--sal) - 4px)}
.card .stitle{flex:none;padding:0 calc(var(--pad) + var(--sar)) 10px calc(var(--pad) + var(--sal))}
.card .stitle h2{margin:0;font-size:34px;font-weight:300;letter-spacing:-.02em;line-height:1.15}
.card .stitle .ssub{display:block;margin-top:5px;font-size:15px;color:var(--dim);line-height:1.4}
.card .tools{flex:none;padding:0 calc(var(--pad) + var(--sar)) 0 calc(var(--pad) + var(--sal))}
.body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:0 calc(var(--pad) + var(--sar)) calc(28px + var(--sab)) calc(var(--pad) + var(--sal))}
.search{display:flex;align-items:center;min-height:50px;border-bottom:1px solid var(--hair)}
.search input{flex:1;min-width:0;height:50px;font-size:17px;padding:0}
.search input::placeholder{color:var(--faint)}
.search .jump{flex:none;height:50px;padding-left:14px;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:17px}
.search .sort{flex:none;width:44px;height:50px;margin-left:4px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.search .sort svg{width:22px;height:22px;transition:transform .2s}
.search .sort.desc svg{transform:scaleY(-1)}
.search .sort:active{color:var(--text)}
.pagehit:empty{display:none}

/* two-line list rows */
.jz{padding:24px 0 6px;font-size:15px;letter-spacing:.01em;color:var(--dim);border-bottom:1px solid var(--hair);
  display:flex;justify-content:space-between;gap:12px}
.jz.on{color:var(--accent)}
.jz .jn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;width:100%;min-height:58px;padding:9px 0;border-bottom:1px solid var(--hair);text-align:left}
.row .n{flex:none;width:36px;color:var(--dim);font-size:15px;font-variant-numeric:tabular-nums}
.row .mid{flex:1;min-width:0}
.row .t{display:block;font-size:17px;line-height:1.35}
.row .s{display:block;margin-top:2px;font-size:15px;line-height:1.4;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums}
.row .s b{font-weight:400;color:var(--accent)}
.row .arn{flex:none;margin-left:14px;font-family:var(--quran);font-size:23px;line-height:1.4;direction:rtl;unicode-bidi:isolate}
.row.cont .t,.row.cont .arn{color:var(--dim)}
.row.pg .t,.row.pg .arn{color:var(--text)}      /* a page found by search is an answer, not a continuation */
.row.playing .t,.row.playing .arn{color:var(--accent)}
.row.off{opacity:.4}
.row:not(.off):active{opacity:.55}
.empty{padding:36px 0;color:var(--dim);font-size:17px;text-align:center}

/* ayah grid in the position picker */
.ayahs{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 0 16px;border-bottom:1px solid var(--hair)}
.ayahs button{height:44px;font-size:17px;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
.ayahs button.on{color:var(--accent)}
.ayahs button:active{color:var(--text)}
.subhd{padding:14px 0 2px;font-size:15px;color:var(--dim)}

/* revise */
.choice{display:block;width:100%;text-align:left;padding:20px 0 18px;border-bottom:1px solid var(--hair)}
.choice .nm{display:block;font-size:24px;font-weight:300;letter-spacing:-.01em}
.choice .df{display:block;margin-top:6px;font-size:15px;color:var(--dim);line-height:1.45;font-variant-numeric:tabular-nums}
.choice .df b{font-weight:400;color:var(--text)}
.choice:active .nm{opacity:.55}

/* ---------------- full player ---------------- */
.player{position:fixed;left:0;top:0;right:0;bottom:0;z-index:40;background:linear-gradient(180deg,#05070C 0%,#0A0F1A 100%);
  transform:translateY(102%);transition:transform .36s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  padding:var(--sat) var(--sar) 0 var(--sal)}
.player.show{transform:translateY(0)}
.grab{flex:none;height:44px;display:flex;align-items:center;justify-content:center;touch-action:none}
.grab i{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
/* the way back to the list a recitation or lecture came from */
.plist{position:absolute;z-index:2;top:var(--sat);right:calc(10px + var(--sar));width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.plist svg{width:24px;height:24px}
.plist:active{color:var(--text)}
/* Select: every word is a target; what is not in the span is dimmed, a first tap is underlined */
.txt .in.pickable .w{cursor:pointer}
.txt .in .w.out{opacity:.3}
.txt .in .w.pick{color:var(--accent);opacity:1;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.4em}
.pbody{flex:1;min-height:0;display:flex;flex-direction:column;
  padding:0 calc(var(--pad) + var(--sar)) calc(10px + var(--sab)) calc(var(--pad) + var(--sal))}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.ptitle{flex:none;padding:0 0 6px}
.ptitle h2{margin:0;font-size:30px;font-weight:300;letter-spacing:-.02em;line-height:1.2}
.ptitle h2.ar{font-size:32px;line-height:1.5;font-weight:400}
.ptitle .psub{display:block;margin-top:2px;font-size:15px;color:var(--dim);line-height:1.4;font-variant-numeric:tabular-nums}

/* bounded Arabic box: never taller than 44vh, centred by margin:auto, the lit word scrolled into view */
.txt{flex:1;min-height:104px;max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  display:flex;padding:6px 0}
.txt .in{width:100%;margin:auto;text-align:center;direction:rtl;font-family:var(--quran);font-size:33px;line-height:1.95;word-spacing:.06em;
  transition:opacity .45s}
.txt .in.s2{font-size:29px;line-height:1.9}
.txt .in.none{font-family:var(--font);direction:ltr;font-size:17px;color:var(--dim);line-height:1.5}
.txt .in .w{transition:color .1s}
.txt .in .w.on{color:var(--accent)}
.txt .in .aend{color:var(--faint);font-size:.62em;margin:0 .2em}
.txt.recite .in{opacity:.2}
@media (prefers-reduced-motion:reduce){.txt .in,.txt .in .w{transition:none}}
.pinfo{flex:none;text-align:center;font-size:15px;line-height:1.45;color:var(--dim);min-height:22px;padding:4px 0;font-variant-numeric:tabular-nums}
.pinfo .state{color:var(--text)}
.prog{flex:none;padding:14px 0 2px;touch-action:none}
.prog .track{position:relative;height:2px;background:var(--hair)}
.prog .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
.prog .times{display:flex;justify-content:space-between;margin-top:8px;font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums}
.transport{flex:none;display:flex;align-items:center;justify-content:center;padding:6px 0 2px}
.transport button{display:flex;align-items:center;justify-content:center;width:64px;height:64px;color:var(--text)}
/* ±15 s: the numeral is DOM text at 15px, never SVG text under the floor */
.transport .skip{display:flex;align-items:center;justify-content:center}
.transport .skip svg{width:24px;height:24px}
.transport .skip .n15{margin-left:3px;font-size:15px;font-weight:400;line-height:1}
.transport button:active{opacity:.5}
.transport .play{width:88px;height:88px;margin:0 16px}
/* the ring: fills while the block plays, drains during the silence.
   .transport .ring must out-specify .transport button, or the 96px SVG would overflow a 64px box */
.transport .ring{position:relative;width:96px;height:96px;margin:0 14px;display:flex;align-items:center;justify-content:center}
.ring svg.r{position:absolute;left:0;top:0;width:96px;height:96px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2}
.ring .track{stroke:var(--hair)}
.ring .fill{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:289.03;stroke-dashoffset:289.03}
.ring .core{position:relative;display:flex;align-items:center;justify-content:center;color:var(--text)}
.ring:active .core{opacity:.5}
.options{flex:none;display:flex;height:0;overflow:hidden;transition:height .2s ease}
.options.show{height:50px;border-top:1px solid var(--hair)}
.options button{flex:1;min-width:0;min-height:50px;font-size:17px;color:var(--dim);text-align:center;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.options button.on{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.options{transition:none}}
.pickers{flex:none;display:flex;border-top:1px solid var(--hair);
  margin:4px calc(-1 * (var(--pad) + var(--sar))) 0 calc(-1 * (var(--pad) + var(--sal)))}
.pickers button{flex:1;min-width:0;min-height:56px;padding:9px 2px 8px;text-align:center}
.pickers button + button{border-left:1px solid var(--hair)}
.pickers .lbl{display:block;font-size:15px;line-height:1.35;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pickers .val{display:block;margin-top:1px;font-size:16px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums}
.pickers button.open .val{color:var(--accent)}
/* the 56px position row */
.posrow{flex:none;display:flex;align-items:center;width:100%;min-height:56px;border-top:1px solid var(--hair);gap:10px}
.posrow .l{flex:none;font-size:17px;color:var(--dim)}
.posrow .v{flex:1;min-width:0;text-align:right;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-variant-numeric:tabular-nums}
.posrow .v .ar{font-size:19px;margin-left:6px}
.posrow .c{flex:none;color:var(--faint);display:flex;align-items:center}
.posrow .c svg{width:9px;height:16px}
.posrow .pv{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:56px}
.posrow .pv:active .v{opacity:.55}
/* the tick beside the position: "I have memorised this" — he says it, listening never does */
.posrow .ok{flex:none;width:44px;height:56px;margin-right:-10px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.posrow .ok svg{width:24px;height:24px}
.posrow .ok:active{color:var(--accent)}
.body .posrow{border-top:0;border-bottom:1px solid var(--hair)}
.body .posrow:active .v{opacity:.55}
/* a recitation with a second reader: the two choices sit under the surah row */
.row.alt{min-height:50px;padding-left:36px}
.row.alt .t{font-size:17px}
.row.alt + .row:not(.alt){border-top:0}
.dlrow{flex:none;display:flex;align-items:center;justify-content:center;min-height:48px;font-size:15px;color:var(--dim);
  font-variant-numeric:tabular-nums}
.dlrow:active{color:var(--text)}
.dlrow.have{color:var(--accent)}

/* ---------------- toast + boot ---------------- */
#toast{position:fixed;left:50%;bottom:calc(var(--mini) + 26px + var(--sab));transform:translate(-50%,16px);z-index:60;
  background:#131926;border:1px solid var(--hair);padding:12px 18px;border-radius:14px;font-size:15px;color:var(--text);
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:86vw;text-align:center;line-height:1.4}
#toast.show{opacity:1;transform:translate(-50%,0)}
.boot{position:fixed;left:0;top:0;right:0;bottom:0;z-index:70;background:#05070C;display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:17px;padding:0 32px;text-align:center;line-height:1.5;transition:opacity .3s}
.boot.gone{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:0s!important;animation:none!important}}
@media (max-width:392px){.pickers .val{font-size:15px}}
/* A laptop: the phone's layout as a centred column, never stretched across the screen. The dimmed
   backdrop behind a sheet stays full width; everything he reads or taps is 560px at most. */
@media (min-width:640px){
  #app{left:50%;right:auto;width:560px;margin-left:-280px}
  .mini{left:50%;right:auto;width:560px;margin-left:-280px;border-left:1px solid var(--hair);border-right:1px solid var(--hair)}
  .card{left:50%;right:auto;width:560px;margin-left:-280px;top:36px;border:1px solid var(--hair);border-bottom:0;border-radius:14px 14px 0 0}
  .player{left:50%;right:auto;width:560px;margin-left:-280px;border-left:1px solid var(--hair);border-right:1px solid var(--hair)}
  .txt{max-height:40vh}
}
@media (max-height:700px){
  .txt .in{font-size:30px;line-height:1.85}
  .txt .in.s2{font-size:27px}
  .htitle h1,.card .stitle h2{font-size:30px}
  .ptitle h2{font-size:26px}
  .ptitle h2.ar{font-size:28px}
  .transport .ring{width:88px;height:88px}
  .ring svg.r{width:88px;height:88px}
}
</style>
</head>
<body>

</div></div>

  <div class="grab" id="grab" role="button" aria-label="Close player"><i></i></div>
  <button id="plList" class="plist hide" aria-label="Back to the list"></button>
  <div class="pbody">

    <section id="lv" class="view hide">
      <div class="ptitle"><h2 id="lvTitle"></h2><span class="psub" id="lvSub"></span></div>
      <div class="txt" id="lvTxt"><div class="in" id="lvText"></div></div>

    </section>

  </div>
</div>
<div id="toast" role="status"></div>

<script>
'use strict';
/* ============================================================================
   Mushaf — one file. Engine and geometry from candidate c, visual grammar and
   the dynamic-programming block split from candidate b, the fallback stop timer
   and the fixed body from candidate a.
   ========================================================================= */
var BASE = './quran/';                     /* Quran data */
var CONTENT = './content/';                /* collection manifests */
var AUDIO_CACHE = 'mushaf-audio-v1';       /* must match sw.js */

function noop() {}
function $(id) { return document.getElementById(id); }
function qs(sel, el) { return (el || document).querySelector(sel); }
function qsa(sel, el) { return Array.prototype.slice.call((el || document).querySelectorAll(sel)); }
function on(el, ev, fn, opts) { el.addEventListener(ev, fn, opts || false); }
function once(el, ev, fn) { var h = function (e) { el.removeEventListener(ev, h); fn(e); }; el.addEventListener(ev, h); return function () { el.removeEventListener(ev, h); }; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  sec = Math.floor(sec);
  var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
function arDigits(n) { return String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'.charAt(+d); }); }
function fmtX(v) { return (v === 1 ? '1' : String(v)) + '×'; }

var LS = {
  pre: 'mushaf.',
  get: function (k, d) { try { var v = localStorage.getItem(LS.pre + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(LS.pre + k, JSON.stringify(v)); } catch (e) {} }
};

var KINDS = [
  { id: 'memorize', name: 'Memorise', desc: 'Blocks, then a silence to recite back' },
  { id: 'revise', name: 'Revise', desc: 'Pages, surah, juz or everything' },
  { id: 'husary', name: 'Quran · Husary', desc: 'Any surah, then straight on' },
  { id: 'reciters', name: 'Recitations', desc: 'Favourite reciters' },
  { id: 'sharh', name: 'Sharh Usul ath-Thalatha', desc: 'Lessons' },
  { id: 'hadith', name: 'Hadith', desc: 'Lessons' },
  { id: 'podcasts', name: 'Podcasts', desc: 'Episodes' }
];
var KIND = {}; KINDS.forEach(function (k) { KIND[k.id] = k; });
var TILE_ORDER = KINDS.map(function (k) { return k.id; });
var DEFAULT_TILES = ['memorize', 'revise', 'husary', 'reciters', 'sharh', 'hadith'];
var SPEEDS_Q = [0.5, 0.75, 1, 1.25], SPEEDS_L = [0.75, 1, 1.25, 1.5];
var PAUSES = [0.75, 1, 1.25, 1.5], REPEATS = [1, 2, 3, 0];      /* 0 = infinite */
var MODES = ['ayah', '2', '3', 'select'];
var MODE_LABEL = { ayah: 'Ayah', '2': '2 ayat', '3': '3 ayat', select: 'Select' };
var RECITER = 'Mahmoud Khalil al-Husary';
var SORT_DEFAULT = { husary: 'asc', pos: 'desc', mem: 'desc', add: 'asc', rec: 'asc' };

var S = {
  layout: LS.get('layout', null),
  pos: LS.get('pos', { s: 114, a: 1 }),
  memo: LS.get('memo', {}),
  listen: LS.get('listen', {}),
  resume: LS.get('resume', {}),
  recent: LS.get('recent', {}),
  now: LS.get('now', null),
  /* what he has MEMORISED, which he says himself - listening in Memorise never counts.
     last: the last ayah of the run he is building from the back (surah last.s up to ayah last.a,
     and every surah after it to An-Nas); extra: whole surahs memorised outside that run. */
  mem: LS.get('mem', null),
  ui: LS.get('ui', {}),
  hist: LS.get('hist', {})                    /* recitations: { id: { secs, last, plays, seen } } */
};
(function normalise() {                      /* defaults are merged, never trusted from storage */
  var L = S.layout;
  if (!L || !L.tiles || !L.tiles.length) L = { size: 6, tiles: DEFAULT_TILES.slice() };
  L.size = L.size === 4 ? 4 : 6;
  var seen = {};
  L.tiles = L.tiles.filter(function (id) { if (!KIND[id] || seen[id]) return false; seen[id] = 1; return true; }).slice(0, L.size);
  if (!L.tiles.length) L.tiles = DEFAULT_TILES.slice(0, L.size);
  S.layout = L; LS.set('layout', L);
  var m = S.memo, d = { speed: 1, pause: 1, repeat: 2, mode: 'ayah', sel: null };
  /* once: the first version defaulted to Auto; one ayah is the default now */
  if (m.v !== 2) { m.mode = 'ayah'; m.v = 2; }
  for (var k in d) if (!(k in m)) m[k] = d[k];
  if (SPEEDS_Q.indexOf(m.speed) < 0) m.speed = 1;
  if (PAUSES.indexOf(m.pause) < 0) m.pause = 1;
  if (REPEATS.indexOf(m.repeat) < 0) m.repeat = 2;
  /* Auto is gone, and Words-by-count became Select (he picks the words himself): whatever he was
     using carries over to the nearest thing that still exists */
  if (m.mode === 'words') m.mode = 'select';
  if (MODES.indexOf(m.mode) < 0) m.mode = 'ayah';
  delete m.text; delete m.source; delete m.words;
  save('memo');
  for (var sk in SORT_DEFAULT) if (S.ui[sk] !== 'asc' && S.ui[sk] !== 'desc') S.ui[sk] = SORT_DEFAULT[sk];
  if (SPEEDS_Q.indexOf(S.listen.q) < 0) S.listen.q = 1;
  if (SPEEDS_L.indexOf(S.listen.l) < 0) S.listen.l = 1;
  if (!S.pos || !(S.pos.s >= 1 && S.pos.s <= 114)) S.pos = { s: 114, a: 1 };
  if (!(S.pos.a >= 1)) S.pos.a = 1;
})();
function save(k) { LS.set(k, S[k]); }

/* ---------------- data ---------------- */
var D = { meta: null, words: null, timings: {}, content: {} };
function loadJSON(url) { return fetch(url).then(function (r) { if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); }); }
function loadData() {
  return Promise.all([
    loadJSON(BASE + 'meta.json'), loadJSON(BASE + 'words.json'), loadJSON(BASE + 'husary-timings.json'),
    loadJSON(CONTENT + 'reciters.json').catch(function () { return null; }),
    loadJSON(CONTENT + 'sharh.json').catch(function () { return null; }),
    loadJSON(CONTENT + 'hadith.json').catch(function () { return null; }),
    loadJSON(CONTENT + 'podcasts.json').catch(function () { return null; })
  ]).then(function (r) {
    D.meta = r[0]; D.words = r[1]; D.timings.murattal = r[2];
    D.content.reciters = r[3]; D.content.sharh = r[4]; D.content.hadith = r[5]; D.content.podcasts = r[6];
    D.pageKeys = D.meta.pageStarts.map(keyOf); D.juzKeys = D.meta.juzStarts.map(keyOf);
    if (S.pos.a < 1 || S.pos.a > surah(S.pos.s).ayahs) S.pos.a = 1;
    Rec.build();
    Mem.normalise();
  });
}
function timings() { return D.timings.murattal; }

/* ---------------- mushaf geometry ---------------- */
function keyOf(str) { var p = str.split(':'); return (+p[0]) * 1000 + (+p[1]); }
function surah(n) { return D.meta.surahs[n - 1]; }
function refKey(s, a) { return s * 1000 + a; }
function lastIndex(keys, key) { var lo = 0, hi = keys.length - 1, ans = 0, m; while (lo <= hi) { m = (lo + hi) >> 1; if (keys[m] <= key) { ans = m; lo = m + 1; } else hi = m - 1; } return ans; }
function pageOf(s, a) { return lastIndex(D.pageKeys, refKey(s, a)) + 1; }
function juzOf(s, a) { return lastIndex(D.juzKeys, refKey(s, a)) + 1; }
function parseRef(str) { var p = str.split(':'); return { s: +p[0], a: +p[1] }; }
function prevAyah(r) { if (r.a > 1) return { s: r.s, a: r.a - 1 }; if (r.s === 1) return { s: 1, a: 1 }; return { s: r.s - 1, a: surah(r.s - 1).ayahs }; }
function pageStart(p) { return parseRef(D.meta.pageStarts[p - 1]); }
function pageEnd(p) { return p >= 604 ? { s: 114, a: 6 } : prevAyah(pageStart(p + 1)); }
function juzEnd(j) { return j >= 30 ? { s: 114, a: 6 } : prevAyah(parseRef(D.meta.juzStarts[j])); }
function rangesBetween(from, to) {          /* inclusive, canonical order, one range per surah */
  var out = [], s;
  if (refKey(from.s, from.a) > refKey(to.s, to.a)) return out;
  for (s = from.s; s <= to.s; s++) out.push({ s: s, a1: s === from.s ? from.a : 1, a2: s === to.s ? to.a : surah(s).ayahs });
  return out;
}
function refStr(r) { return r.s + ':' + r.a; }
function pagesIn(ranges) {                  /* how many mushaf pages a set of ranges touches */
  var seen = {}, n = 0;
  ranges.forEach(function (r) { for (var p = pageOf(r.s, r.a1), q = pageOf(r.s, r.a2); p <= q; p++) if (!seen[p]) { seen[p] = 1; n++; } });
  return n;
}

/* ============================================================================
   Memorised: what he SAYS he knows. Listening in Memorise never changes it.
   He builds one run from the back (An-Nas, Al-Falaq, … then surah by surah downwards, each
   surah learnt from its first ayah), so the run is described by its last ayah: surah last.s
   from ayah 1 to last.a, plus every surah after it to An-Nas. Anything learnt outside that run
   (Al-Kahf) is a whole surah in `extra`.
   ========================================================================= */
var Mem = {
  /* how far along his run a reference is: lower surahs are further, and inside a surah later ayat */
  ext: function (r) { return r ? (114 - r.s) * 1000 + r.a : -1; },
  normalise: function () {
    var m = S.mem;
    if (!m || typeof m !== 'object') m = { last: Mem.derive(), extra: [18] };   /* he told us: Al-Kahf */
    if (m.last && !(m.last.s >= 1 && m.last.s <= 114 && m.last.a >= 1 && m.last.a <= surah(m.last.s).ayahs)) m.last = null;
    m.extra = (m.extra || []).filter(function (n, i, arr) { return n >= 1 && n <= 114 && arr.indexOf(n) === i; });
    m.extra.sort(function (a, b) { return a - b; });
    S.mem = m; save('mem');
  },
  derive: function () {                      /* first run only: the ayah before the one Memorise is on */
    var p = S.pos;
    if (p.a > 1) return { s: p.s, a: p.a - 1 };
    if (p.s < 114) return { s: p.s + 1, a: surah(p.s + 1).ayahs };
    return null;
  },
  changed: function () { save('mem'); if (window.Home) Home.refresh(); },
  extend: function (r) { if (Mem.ext(r) <= Mem.ext(S.mem.last)) return false; S.mem.last = { s: r.s, a: r.a }; Mem.changed(); return true; },
  setLast: function (r) { S.mem.last = r ? { s: r.s, a: r.a } : null; Mem.changed(); },
  addExtra: function (n) { if (S.mem.extra.indexOf(n) < 0) { S.mem.extra.push(n); S.mem.extra.sort(function (a, b) { return a - b; }); } Mem.changed(); },
  removeExtra: function (n) { S.mem.extra = S.mem.extra.filter(function (x) { return x !== n; }); Mem.changed(); },
  /* the ayah after the last memorised one, in his direction (a finished surah hands over to n-1) */
  next: function () {
    var l = S.mem.last; if (!l) return { s: 114, a: 1 };
    if (l.a < surah(l.s).ayahs) return { s: l.s, a: l.a + 1 };
    return l.s > 1 ? { s: l.s - 1, a: 1 } : null;
  },
  run: function () {                         /* mushaf order: the surah he is in, then the ones before it in time */
    var l = S.mem.last, out = [], s; if (!l) return out;
    out.push({ s: l.s, a1: 1, a2: l.a });
    for (s = l.s + 1; s <= 114; s++) out.push({ s: s, a1: 1, a2: surah(s).ayahs });
    return out;
  },
  /* a whole surah the run already holds does not need to appear again as an extra */
  covers: function (n) { var l = S.mem.last; return !!l && (n > l.s || (n === l.s && l.a === surah(n).ayahs)); },
  extras: function () { return S.mem.extra.filter(function (n) { return !Mem.covers(n); }); },
  /* The N pages he memorised most recently, as a contiguous stretch of the mushaf. Inside a long
     surah that is the N pages ending at his last ayah; otherwise the stretch starts on the first
     page of the surah he is in and runs on into the surahs he finished before it. */
  recent: function (N) {
    var l = S.mem.last; if (!l) return [];
    var pS = pageOf(l.s, 1), pA = pageOf(l.s, l.a), p0 = Math.max(pS, pA - N + 1), p1 = Math.min(604, p0 + N - 1);
    var lo = pageStart(p0), hi = pageEnd(p1), loK = refKey(lo.s, lo.a), hiK = refKey(hi.s, hi.a), out = [];
    Mem.run().forEach(function (r) {
      var a1 = refKey(r.s, r.a1) < loK ? (r.s === lo.s ? lo.a : 0) : r.a1;
      var a2 = refKey(r.s, r.a2) > hiK ? (r.s === hi.s ? hi.a : 0) : r.a2;
      if (a1 >= 1 && a2 >= a1) out.push({ s: r.s, a1: a1, a2: a2 });
    });
    return out;
  },
  lastSurah: function () { var l = S.mem.last; return l ? [{ s: l.s, a1: 1, a2: l.a }] : []; },
  everything: function () {                  /* every memorised ayah, in mushaf order */
    var byS = {}, out = [];
    Mem.run().forEach(function (r) { byS[r.s] = r; });
    S.mem.extra.forEach(function (n) { byS[n] = { s: n, a1: 1, a2: surah(n).ayahs }; });
    Object.keys(byS).map(Number).sort(function (a, b) { return a - b; }).forEach(function (n) { out.push(byS[n]); });
    return out;
  },
  summary: function () {                     /* one line: where the run stands, and what else */
    var l = S.mem.last, ex = Mem.extras(), parts = [];
    if (l) parts.push(surah(l.s).name + ' ' + l.a);
    ex.forEach(function (n) { parts.push(surah(n).name); });
    return parts.length ? parts.join(' · ') : 'Nothing marked yet';
  }
};

/* ---------------- toast ---------------- */
var toastTimer = 0;
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
}

/* ---------------- icons ---------------- */
var ICON = {
  play: '<svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><path d="M9 5v22l19-11z" fill="currentColor"/></svg>',
  pause: '<svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><path d="M10 6h3.6v20H10zM18.4 6H22v20h-3.6z" fill="currentColor"/></svg>',
  play24: '<svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M9 5v22l19-11z" fill="currentColor"/></svg>',
  pause24: '<svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M10 6h3.6v20H10zM18.4 6H22v20h-3.6z" fill="currentColor"/></svg>',
  prev: '<svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><path d="M9 7v18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M23 7.5 11.5 16 23 24.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  next: '<svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><path d="M23 7v18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M9 7.5 20.5 16 9 24.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  chev: '<svg viewBox="0 0 11 19" width="9" height="16" aria-hidden="true"><path d="M1.5 1.5 9.5 9.5l-8 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  minus: '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7.5 12h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  plus: '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7.5 12h9M12 7.5v9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  handle: '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 8h16M4 12h16M4 16h16" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>',

/* ============================================================================
   Recitations: a recitation per surah (sometimes two), and five picks from what he listens to.
   content/reciters.json: { title, surahs: { "36": [ { reciter, url }, … ], … } }
   ========================================================================= */
var Rec = {
  byS: {}, list: [], byId: {},
  build: function () {
    var c = D.content.reciters;
    Rec.byS = {}; Rec.list = []; Rec.byId = {};
    if (!c) return;
    function add(n, reciter, url) {
      n = +n;
      if (!(n >= 1 && n <= 114) || !url) return;
      var id = n + '-' + String(reciter || 'reciter').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      if (Rec.byId[id]) return;
      var it = { id: id, surah: n, reciter: reciter || '', url: url };
      (Rec.byS[n] = Rec.byS[n] || []).push(it); Rec.list.push(it); Rec.byId[id] = it;
    }
    if (c.surahs) Object.keys(c.surahs).forEach(function (k) { (c.surahs[k] || []).forEach(function (r) { add(k, r.reciter, r.url); }); });
    if (c.items) c.items.forEach(function (r) { add(r.surah, r.reciter, r.url); });      /* the first format */
  },
  surahs: function () { return Object.keys(Rec.byS).map(Number).sort(function (a, b) { return a - b; }); },
  /* "Muhammad Siddiq al-Minshawi" -> "al-Minshawi"; "Abdul Basit (Mujawwad)" -> "Abdul Basit (Mujawwad)" */
  short: function (name) {
    var style = /\(([^)]+)\)/.exec(name || ''), w = String(name || '').replace(/\s*\(.*\)\s*/, '').trim().split(/\s+/);
    var last = w[w.length - 1] || '', core = /^(al|as|ash|ad|ar|an|at|az)-/i.test(last) || w.length < 2 ? last : w.slice(-2).join(' ');
    return core + (style ? ' (' + style[1] + ')' : '');
  },
  /* listening time, counted while it really plays; a listen of 30 s or more is a play */
  hist: function (id) { return S.hist[id] || (S.hist[id] = { secs: 0, last: 0, plays: 0, seen: 0 }); },
  started: function (id) { var h = Rec.hist(id); h.seen = 0; h.session = 0; h.counted = false; save('hist'); },
  /* what plays when a recitation ends, or when the tile is tapped and the last one was finished */
  after: function (id) {
    var p = Rec.picks().filter(function (it) { return it.id !== id; });
    if (p.length) return p[0];
    var cur = Rec.byId[id], ss = Rec.surahs(), i = cur ? ss.indexOf(cur.surah) : -1;
    var n = ss.length ? ss[(i + 1) % ss.length] : 0;
    return n ? Rec.byS[n][0] : null;
  },
  heard: function (id, dt) {
    var h = Rec.hist(id); h.secs += dt; h.last = Date.now(); h.session = (h.session || 0) + dt;
    if (h.session >= 30 && !h.counted) { h.plays++; h.counted = true; }
  },
  /* Five picks, and not the YouTube failure of the same thing over and over:
     - familiar: what he listens to most, fading by half every 14 days;
     - similar: the same reciter in another surah, or a surah near one he loves (within three,
       or in the same juz), weighted by how much he loves that one;
     alternated familiar, similar, familiar, similar, familiar. The one just played is left out, a
     surah appears once, a reciter at most twice, and anything shown without being played fades a
     little each time the list opens, so the five keep moving. */
  picks: function () {
    var H = S.hist, now = Date.now(), DAY = 864e5, lastId = S.recent.reciters && S.recent.reciters.id;
    function fam(it) { var h = H[it.id]; return h && h.secs > 0 ? Math.log(1 + h.secs / 60) * Math.pow(0.5, (now - h.last) / (14 * DAY)) : 0; }
    function fatigue(it) { var h = H[it.id]; return h && h.seen ? Math.pow(0.8, h.seen) : 1; }
    var heard = Rec.list.filter(function (it) { return H[it.id] && H[it.id].secs >= 30; });
    if (!heard.length) return [];
    var top = heard.slice().sort(function (a, b) { return fam(b) - fam(a); }).slice(0, 4);
    function sim(it) {
      var s = 0, a = surah(it.surah);
      top.forEach(function (t) {
        if (t.id === it.id) return;
        var w = fam(t), b = surah(t.surah), ratio = Math.max(a.ayahs, b.ayahs) / Math.min(a.ayahs, b.ayahs);
        if (t.reciter && t.reciter === it.reciter) s += w;
        if (Math.abs(t.surah - it.surah) <= 3) s += 0.6 * w;
        if (b.juz === a.juz) s += 0.4 * w;
        if (b.makki === a.makki) s += 0.2 * w;           /* the gentler kinds of alike, so a small */
        if (ratio <= 2) s += 0.2 * w;                    /* list still has something to offer    */
      });
      return s;
    }
    function byScore(a, b) { return b.sc - a.sc; }
    var F = heard.filter(function (it) { return it.id !== lastId; }).map(function (it) { return { it: it, sc: fam(it) * fatigue(it) }; }).sort(byScore);
    var Sm = Rec.list.filter(function (it) { return it.id !== lastId && !(H[it.id] && H[it.id].secs >= 600); })
      .map(function (it) { return { it: it, sc: sim(it) * fatigue(it) }; }).filter(function (x) { return x.sc > 0; }).sort(byScore);
    var out = [], usedS = {}, perR = {}, fi = 0, si = 0, turn = 0;
    function take(arr, i) {
      for (; i < arr.length; i++) {
        var it = arr[i].it;
        if (usedS[it.surah] || (perR[it.reciter] || 0) >= 2) continue;
        usedS[it.surah] = 1; perR[it.reciter] = (perR[it.reciter] || 0) + 1; out.push(it);
        return i + 1;
      }
      return -1;
    }
    while (out.length < 5 && (fi >= 0 || si >= 0)) {
      if (turn % 2 === 0 && fi >= 0) fi = take(F, fi);
      else if (si >= 0) si = take(Sm, si);
      else fi = take(F, fi);
      turn++;
      if (fi < 0 && si < 0) break;
    }
    /* still short: what he has not heard for longest (never heard first) - exploration, not a loop */
    if (out.length < 5) {
      var Fr = Rec.list.filter(function (it) { return it.id !== lastId; })
        .map(function (it) { var h = H[it.id]; return { it: it, sc: (h && h.last ? (now - h.last) / DAY : 1e6) * fatigue(it) }; }).sort(byScore);
      for (var fr = 0; out.length < 5 && fr >= 0;) fr = take(Fr, fr);
    }
    return out;
  },
  shown: function (items) { items.forEach(function (it) { Rec.hist(it.id).seen++; }); save('hist'); }
};

/* ============================================================================
   Downloads into Cache Storage (the service worker answers from it)
   ========================================================================= */
var DL = {
  have: {}, prog: {},
  init: function () {
    if (!('caches' in window)) return;
    caches.open(AUDIO_CACHE).then(function (c) { return c.keys(); }).then(function (reqs) {
      reqs.forEach(function (r) { DL.have[r.url] = 1; });
      Deck.render(true);
    }).catch(noop);
  },
  state: function (url) { if (DL.have[url]) return 'done'; if (url in DL.prog) return DL.prog[url]; return 'none'; },
  download: function (url) {
    if (!('caches' in window)) { toast('Offline storage is not available here'); return; }
    if (DL.have[url]) { toast('Already saved on this phone'); return; }
    if (url in DL.prog) return;
    DL.prog[url] = 0; Deck.render(true);
    fetch(url, { mode: 'cors' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var total = +res.headers.get('Content-Length') || 0, got = 0, chunks = [], reader = res.body.getReader();
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) return;
          chunks.push(r.value); got += r.value.length;
          var pct = total ? Math.min(99, Math.floor(got / total * 100)) : 0;
          if (pct !== DL.prog[url]) { DL.prog[url] = pct; Deck.render(true); }
          return pump();
        });
      }
      return pump().then(function () {
        var blob = new Blob(chunks, { type: 'audio/mpeg' });
        return caches.open(AUDIO_CACHE).then(function (c) {
          return c.put(url, new Response(blob, { status: 200, headers: {
            'Content-Type': 'audio/mpeg', 'Content-Length': String(blob.size), 'Accept-Ranges': 'bytes' } }));
        });
      });
    }).then(function () {
      delete DL.prog[url]; DL.have[url] = 1; Deck.render(true); toast('Saved on this phone');
    }, function (e) {
      delete DL.prog[url]; Deck.render(true); toast('Download failed — ' + (e && e.message ? e.message : 'try again'));
    });
  }
};

/* On a laptop: space plays and pauses, the arrows step, Escape closes whatever is on top. */
on(document, 'keydown', function (e) {
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) { if (e.key === 'Escape') t.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || !D.meta) return;
  if (e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();   /* or the focused button fires too */
    Deck.toggle();
  } else if (e.key === 'ArrowLeft') { if (Active) Active.prev(); }
  else if (e.key === 'ArrowRight') { if (Active) Active.next(); }
  else if (e.key === 'Escape') {
    if (sheetB.el.classList.contains('show')) sheetB.hide();
    else if (sheetA.el.classList.contains('show')) sheetA.hide();
    else if (Deck.open) Deck.hide();
  }
});
function boot() {
  sheetA = new Sheet('sheetA'); sheetB = new Sheet('sheetB');
  Home.init(); Deck.init(); Home.render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(noop);
  loadData().then(function () {
    $('boot').classList.add('gone');
    Home.render(); Deck.render(true); DL.init(); MediaSess.init();
    window.MUSHAF = { S: S, D: D, Core: Core, Memo: Memo, Listen: Listen, Deck: Deck, Home: Home, DL: DL, Mem: Mem, Rec: Rec,
      Plan: MushafPlan, audio: audio, actions: Actions, lists: Lists, revisionChoices: revisionChoices, active: function () { return Active; }, ready: true };
    document.documentElement.setAttribute('data-ready', '1');
  }, function (err) {
    $('boot').textContent = 'Could not load the Quran data. Check the connection and open Mushaf again.';
    if (window.console) console.error(err);
  });
}
boot();
</script>
