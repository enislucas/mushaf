<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mushaf</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mushaf">
<meta name="theme-color" content="#05070C">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<style>
:root{
  --ink0:#05070C; --ink1:#0A0F1A;
  --text:#F2F4F8; --dim:rgba(255,255,255,.46); --faint:rgba(255,255,255,.26);
  --hair:rgba(255,255,255,.075); --accent:#8AAEFF;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --quran:"KFGQPC Uthman Taha Naskh","Amiri","Scheherazade New","Noto Naskh Arabic",serif;
  --pad:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#05070C;height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;position:fixed;top:0;left:0;right:0;bottom:0;height:100vh;height:100dvh;overflow:hidden;
  background:linear-gradient(180deg,#05070C 0%,#0A0F1A 100%);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.3;
  touch-action:manipulation;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;text-align:inherit}
button:disabled{cursor:default}
input{font:inherit;color:inherit;background:none;border:0;outline:none;-webkit-appearance:none;border-radius:0;-webkit-user-select:text;user-select:text}
svg{display:block}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.ar{font-family:var(--quran);direction:rtl;unicode-bidi:isolate}

/* ---- stack of pages ---- */
#stack{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden}
.page{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#05070C 0%,#0A0F1A 100%);transform:translateX(0);transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.page.enter,.page.leave{transform:translateX(100%)}
@media (prefers-reduced-motion:reduce){.page{transition:none}}
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;height:calc(44px + var(--sat));
  padding:var(--sat) calc(12px + var(--sar)) 0 calc(10px + var(--sal))}
.bar .back{display:flex;align-items:center;height:44px;padding:0 10px 0 6px;color:var(--dim);font-size:17px;max-width:60%}
.bar .back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .back svg{flex:none;width:11px;height:19px;margin-right:7px}
.bar .act{height:44px;padding:0 8px;color:var(--dim);font-size:17px;margin-left:auto}
.title{flex:none;padding:0 calc(var(--pad) + var(--sar)) 14px calc(var(--pad) + var(--sal))}
.title h1{margin:0;font-size:34px;font-weight:300;letter-spacing:-.02em;line-height:1.15}
.title .sub{display:block;margin-top:5px;font-size:15px;color:var(--dim);line-height:1.3}
.title button.sub{color:var(--dim)} .title button.sub:after{content:" \203A";color:var(--faint)}
.body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:0 calc(var(--pad) + var(--sar)) calc(28px + var(--sab)) calc(var(--pad) + var(--sal))}
.body.fill{overflow:hidden;display:flex;flex-direction:column;padding-bottom:var(--sab)}
.empty{padding:40px 0;color:var(--dim);font-size:17px;text-align:center}

/* ---- home grid: typography and hairlines only ---- */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr));padding-bottom:10px}
.grid.four{grid-template-rows:repeat(2,minmax(0,1fr))}
.tile{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;min-width:0;min-height:0;
  padding:18px 14px 22px 0;border-top:1px solid var(--hair)}
.tile:nth-child(odd){border-right:1px solid var(--hair)}
.tile:nth-child(even){padding-left:22px;padding-right:0}
.tile:nth-child(-n+2){border-top:0}
.tile .name{font-size:26px;font-weight:300;letter-spacing:-.02em;line-height:1.12;text-align:left}
.tile .status{margin-top:8px;font-size:15px;color:var(--dim);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tile.live .status{color:var(--accent)}
.tile.blank{pointer-events:none}
.tile:active .name{opacity:.55}

/* ---- edit mode: Control-Center style list ---- */
.edit .sizerow{display:flex;align-items:center;justify-content:space-between;height:56px;border-bottom:1px solid var(--hair)}
.edit .sizerow .lbl{font-size:17px}
.seg{display:flex}
.seg button{padding:8px 16px;color:var(--dim);font-size:17px;font-variant-numeric:tabular-nums}
.seg button.on{color:var(--text)}
.seg button + button{border-left:1px solid var(--hair)}
.sect{margin:28px 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.elist{position:relative}
.erow{display:flex;align-items:center;height:56px;border-bottom:1px solid var(--hair)}
.elist.drag .erow{position:absolute;left:0;right:0;top:0;transition:transform .18s ease}
.erow.lift{transition:none!important;z-index:2;background:#0A0F1A;border-top:1px solid var(--hair)}
.erow .pm{flex:none;width:40px;height:56px;display:flex;align-items:center;color:var(--dim)}
.erow .pm:disabled{opacity:.3}
.erow .nm{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow .hd{flex:none;width:44px;height:56px;display:flex;align-items:center;justify-content:flex-end;color:var(--dim);touch-action:none;cursor:grab}
.edit .hint{margin-top:22px;font-size:15px;color:var(--faint);line-height:1.4}

/* ---- lists ---- */
.search{display:flex;align-items:center;height:50px;border-bottom:1px solid var(--hair)}
.search input{flex:1;min-width:0;height:50px;font-size:17px;padding:0}
.search input::placeholder{color:var(--faint)}
.search .jump{flex:none;color:var(--dim);font-size:15px;height:50px;padding-left:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.jz{padding:24px 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--hair)}
.jz.on{color:var(--accent)}
.row{display:flex;align-items:center;width:100%;min-height:58px;padding:9px 0;border-bottom:1px solid var(--hair)}
.row .n{flex:none;width:38px;color:var(--dim);font-size:15px;font-variant-numeric:tabular-nums}
.row .mid{flex:1;min-width:0}
.row .t{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cont .t{color:var(--dim)}
.row .s{display:block;margin-top:2px;font-size:15px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.row .s b{font-weight:400;color:var(--accent)}
.row .arn{flex:none;margin-left:14px;font-family:var(--quran);font-size:23px;line-height:1;direction:rtl}
.row.cont .arn{color:var(--dim)}
.row.off{opacity:.38}
.row:not(.off):active{opacity:.55}
.hide{display:none!important}
input::-webkit-search-cancel-button,input::-webkit-search-decoration{-webkit-appearance:none;display:none}

/* ---- position picker (accordion) ---- */
.ayahs{display:grid;grid-template-columns:repeat(7,1fr);padding:6px 0 16px;border-bottom:1px solid var(--hair)}
.ayahs button{height:44px;font-size:17px;color:var(--dim);font-variant-numeric:tabular-nums;text-align:center}
.ayahs button.on{color:var(--accent)}
.ayahs button:active{color:var(--text)}

/* ---- revise ---- */
.choice{display:block;width:100%;text-align:left;padding:20px 0 18px;border-bottom:1px solid var(--hair)}
.choice .nm{display:block;font-size:24px;font-weight:300;letter-spacing:-.01em}
.choice .df{display:block;margin-top:6px;font-size:15px;color:var(--dim);line-height:1.4;font-variant-numeric:tabular-nums}
.choice .df b{font-weight:400;color:var(--text)}
.choice:active .nm{opacity:.55}

/* ---- players ---- */
.ptext{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0}
.artext{direction:rtl;text-align:center;font-family:var(--quran);font-size:34px;line-height:1.95;max-width:100%;word-spacing:.06em;transition:opacity .5s}
.artext.s2{font-size:29px;line-height:1.9}
.artext.s3{font-size:24px;line-height:1.85}
.artext .w{transition:color .1s}
.artext .w.now{color:var(--accent)}
.artext .w.lead{color:var(--faint)}
.artext .end{color:var(--faint);font-size:.62em;margin:0 .2em}
.artext.recite{opacity:.2}
.artext.none{font-family:var(--font);direction:ltr;font-size:17px;color:var(--dim);line-height:1.4}
@media (prefers-reduced-motion:reduce){.artext,.artext .w{transition:none}}
.pinfo{flex:none;text-align:center;font-size:15px;color:var(--dim);min-height:20px;font-variant-numeric:tabular-nums;padding:4px 0}
.prog{flex:none;padding:16px 0 4px;touch-action:none}
.prog .track{position:relative;height:2px;background:var(--hair)}
.prog .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
.prog .times{display:flex;justify-content:space-between;margin-top:8px;font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums}
.transport{flex:none;display:flex;align-items:center;justify-content:center;padding:4px 0 0}
.transport button{display:flex;align-items:center;justify-content:center;width:64px;height:64px;color:var(--text)}
.transport button:active{opacity:.5}
.transport .play{width:88px;height:88px;margin:0 20px}
.transport button:disabled{opacity:.3}
.options{flex:none;display:flex;height:0;overflow:hidden;transition:height .2s ease}
.options.show{height:50px;border-top:1px solid var(--hair)}
.options button{flex:1;min-width:0;font-size:17px;color:var(--dim);font-variant-numeric:tabular-nums;text-align:center;white-space:nowrap}
.options button.on{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.options{transition:none}}
.pickers{flex:none;display:flex;border-top:1px solid var(--hair);margin-top:6px}
.pickers button{flex:1;min-width:0;padding:12px 0 10px;text-align:center}
.pickers button + button{border-left:1px solid var(--hair)}
.pickers .lbl{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.pickers .val{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.pickers button.open .val{color:var(--accent)}
.dl{flex:none;text-align:center;padding:12px 0 6px;font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums}
.dl:active{color:var(--text)}
</style>
</head>
<body>
<div id="stack"></div>

<script id="planner">
/* ===== Mushaf planner: pure functions, no DOM. Tested on its own by tests/blocks.test.js. =====
   A block is a run of whole ayat, or a run of words inside one ayah. Word blocks are cut only between words the
   timing data can locate. Husary re-reads a few words after a breath; a cut lands at the end of the FIRST pass of
   the last word and the next block starts at the NEXT onset of its first word, so the re-read itself is skipped and
   every word is heard once. Positions outside the block that are still voiced inside its span ("lead-in" words) are
   listed in `lead` so the UI can show them dimmed. */
var Planner = (function () {
  'use strict';
  var MARK = /[ۖ-ۜ۞۩]/;      /* U+06D6..U+06DC, U+06DE, U+06E9: pause marks, attached to the word they follow */
  var AUTO = { splitAbove: 16000, part: 11000, minPart: 4000, mergeWhileUnder: 8000, mergedMax: 14000, mergeCandidateMax: 16000, hardMax: 18000 };
  var WORDS = { perBlock: 5.5, single: 7, markBonus: 1.5 };

  function hasMark(w) { return MARK.test(w || ''); }

  /* Time-ordered segments, positions clamped to the word count (the ayah-end sign folds into the last word). */
  function orderedSegs(verse, nW) {
    var from = verse[0], to = verse[1], raw = verse[2] || [], out = [], i;
    for (i = 0; i < raw.length; i++) {
      var s = Math.max(from, Math.min(to, raw[i][1])), e = Math.max(from, Math.min(to, raw[i][2]));
      if (e > s) out.push([Math.max(1, Math.min(raw[i][0], nW)), s, e]);
    }
    out.sort(function (a, b) { return a[1] - b[1] || a[0] - b[0]; });
    return out;
  }
  /* End of the first segment of word p starting at or after t0; start of the first segment of word p at or after t0. */
  function endOf(segs, p, t0) { for (var i = 0; i < segs.length; i++) if (segs[i][0] === p && segs[i][1] >= t0 - 1) return segs[i][2]; return null; }
  function startOf(segs, p, t0) { for (var i = 0; i < segs.length; i++) if (segs[i][0] === p && segs[i][1] >= t0 - 1) return segs[i][1]; return null; }

  /* Candidate cut points of an ayah: boundary after word p, with the time the first pass of p ends. */
  function ayahCuts(verse, words) {
    var nW = words.length, segs = orderedSegs(verse, nW), cuts = [], p;
    for (p = 1; p < nW; p++) {
      var t = endOf(segs, p, verse[0]); if (t === null) continue;
      var t2 = startOf(segs, p + 1, t); if (t2 === null) t2 = t;   /* next word unlocated: the next block simply starts here */
      if (t <= verse[0] || t2 >= verse[1]) continue;
      cuts.push({ p: p, t: t, t2: t2, mark: hasMark(words[p - 1]) });
    }
    return cuts;
  }

  function block(s, a1, a2, w1, w2, from, to, partial) {
    return { s: s, a1: a1, a2: a2, w1: w1, w2: w2, from: from, to: to, dur: to - from, partial: !!partial, lead: [] };
  }

  /* Split one ayah at the given word boundaries (ascending p). A cut the audio cannot honour is dropped (its words join the next block). */
  function splitAyah(s, a, verse, words, cutPs) {
    var nW = words.length, segs = orderedSegs(verse, nW), out = [], prevP = 0, from = verse[0], i, k;
    for (i = 0; i < cutPs.length; i++) {
      var p = cutPs[i]; if (p <= prevP || p >= nW) continue;
      var to = endOf(segs, p, from); if (to === null) continue;
      var next = startOf(segs, p + 1, to); if (next === null) next = to;
      out.push(block(s, a, a, prevP + 1, p, from, to, true)); prevP = p; from = next;
    }
    out.push(block(s, a, a, prevP + 1, nW, from, verse[1], out.length > 0));
    for (i = 0; i < out.length; i++) {           /* words voiced inside the span but outside the block: lead-in of a re-read */
      var b = out[i], seen = {};
      for (k = 0; k < segs.length; k++) if (segs[k][1] >= b.from && segs[k][1] < b.to && (segs[k][0] < b.w1 || segs[k][0] > b.w2) && !seen[segs[k][0]]) { seen[segs[k][0]] = 1; b.lead.push(segs[k][0]); }
    }
    return out;
  }

  /* Best partition of one ayah: exact dynamic programme over the candidate cuts, minimising the sum of cost(block). */
  function bestSplit(s, a, verse, words, cost) {
    var nW = words.length, segs = orderedSegs(verse, nW), cuts = ayahCuts(verse, words), N = cuts.length, i, j;
    var best = new Array(N + 2), prev = new Array(N + 2);
    for (j = 0; j <= N + 1; j++) { best[j] = Infinity; prev[j] = -1; }
    best[0] = 0;
    for (j = 1; j <= N + 1; j++) {
      var pHi = j === N + 1 ? nW : cuts[j - 1].p, last = j === N + 1;
      for (i = 0; i < j; i++) {
        if (best[i] === Infinity) continue;
        var from = i === 0 ? verse[0] : cuts[i - 1].t2, pLo = i === 0 ? 1 : cuts[i - 1].p + 1;
        var to = last ? verse[1] : endOf(segs, pHi, from);
        if (to === null || to <= from) continue;
        var c = best[i] + cost(to - from, pHi - pLo + 1, !last && cuts[j - 1].mark, last);
        if (c < best[j]) { best[j] = c; prev[j] = i; }
      }
    }
    var chosen = [];
    for (j = prev[N + 1]; j > 0; j = prev[j]) chosen.unshift(cuts[j - 1].p);
    return splitAyah(s, a, verse, words, chosen);
  }
  /* Auto: aim at 11 s; anything under 4 s or over 18 s is (almost) forbidden; short blocks and cuts off a pause mark cost extra. */
  function autoCost(d, n, mark, last) {
    if (d < AUTO.minPart) return 1000 + (AUTO.minPart - d) / 100;
    if (d > AUTO.hardMax) return 1000 + (d - AUTO.hardMax) / 100;
    var x = (d - AUTO.part) / 1000;
    return x * x + (n < 3 ? 20 : 0) - (mark ? 2 : 0);
  }
  /* Words: aim at 5-6 words, never one. */
  function wordsCost(d, n, mark, last) {
    if (n < 2) return 1000;
    var x = n - WORDS.perBlock;
    return x * x - (mark ? WORDS.markBonus : 0);
  }

  /* mode: 'ayah' | 'ayat2' | 'ayat3' | 'words' | 'auto'.  words = words[s]; verses = timings[s].v */
  function planBlocks(mode, s, words, verses) {
    var n = verses.length, out = [], i, j, d;
    function dur(k) { return verses[k][1] - verses[k][0]; }
    function whole(a1, a2) { return block(s, a1, a2, 1, words[a2 - 1].length, verses[a1 - 1][0], verses[a2 - 1][1], false); }

    if (mode === 'ayah' || mode === 'ayat2' || mode === 'ayat3') {
      var size = mode === 'ayah' ? 1 : (mode === 'ayat2' ? 2 : 3);
      for (i = 0; i < n; i += size) out.push(whole(i + 1, Math.min(n, i + size)));
    } else if (mode === 'words') {
      for (i = 0; i < n; i++) {
        var nW = words[i].length;
        if (nW <= WORDS.single) { out.push(whole(i + 1, i + 1)); continue; }
        out.push.apply(out, bestSplit(s, i + 1, verses[i], words[i], wordsCost));
      }
    } else {                                                  /* auto */
      i = 0;
      while (i < n) {
        d = dur(i);
        if (d > AUTO.splitAbove) { out.push.apply(out, bestSplit(s, i + 1, verses[i], words[i], autoCost)); i++; continue; }
        j = i;
        while (j + 1 < n && dur(j + 1) <= AUTO.mergeCandidateMax && d < AUTO.mergeWhileUnder && d + dur(j + 1) <= AUTO.mergedMax) { d += dur(j + 1); j++; }
        if (d < AUTO.minPart && j + 1 < n && dur(j + 1) <= AUTO.mergeCandidateMax && d + dur(j + 1) <= AUTO.hardMax) { d += dur(j + 1); j++; }
        out.push(whole(i + 1, j + 1));
        i = j + 1;
      }
    }
    for (i = 0; i < out.length; i++) { out[i].k = i + 1; out[i].n = out.length; }
    return out;
  }

  /* Index of the block that contains ayah a (and word w). */
  function blockIndexFor(blocks, a, w) {
    var i; w = w || 1;
    for (i = 0; i < blocks.length; i++) { var b = blocks[i]; if (a >= b.a1 && a <= b.a2 && (b.a1 !== b.a2 || (w >= b.w1 && w <= b.w2))) return i; }
    for (i = 0; i < blocks.length; i++) if (blocks[i].a1 >= a) return i;
    return Math.max(0, blocks.length - 1);
  }

  /* Word position under the play head (ms in file time), from the ayah's segments. 0 = none yet. */
  function wordAt(verse, nW, ms) {
    var segs = verse[2] || [], i, best = -1;
    for (i = 0; i < segs.length; i++) if (ms >= segs[i][1] && ms < segs[i][2]) return Math.min(nW, Math.max(1, segs[i][0]));
    for (i = 0; i < segs.length; i++) if (segs[i][1] <= ms && (best < 0 || segs[i][1] >= segs[best][1])) best = i;
    return best >= 0 ? Math.min(nW, Math.max(1, segs[best][0])) : 0;
  }

  /* Index (0-based) of the ayah whose window contains ms. */
  function ayahAt(verses, ms) {
    var lo = 0, hi = verses.length - 1;
    while (lo < hi) { var mid = (lo + hi + 1) >> 1; if (verses[mid][0] <= ms) lo = mid; else hi = mid - 1; }
    return lo;
  }

  return { planBlocks: planBlocks, blockIndexFor: blockIndexFor, ayahCuts: ayahCuts, bestSplit: bestSplit, wordAt: wordAt, ayahAt: ayahAt, hasMark: hasMark, AUTO: AUTO, WORDS: WORDS, MARK: MARK };
})();
if (typeof module !== 'undefined') module.exports = Planner;
</script>

<script>
(function () {
'use strict';
var BASE = '../../';                       /* the integrator changes this to './' */
var AUDIO_CACHE = 'mushaf-audio-v1';
var QURAN_SPEEDS = [0.5, 0.75, 1, 1.25], LECTURE_SPEEDS = [0.75, 1, 1.25, 1.5];
var PAUSES = [0.75, 1, 1.25, 1.5], REPEATS = [1, 2, 3, 0];   /* 0 = infinite */
var MODES = [['ayah', 'Ayah'], ['ayat2', '2 ayat'], ['ayat3', '3 ayat'], ['words', 'Words'], ['auto', 'Auto']];
var SOURCES = [['murattal', 'Murattal'], ['muallim', 'Muallim']];
var TILES = {
  memorize: 'Memorise', revise: 'Revise', husary: 'Quran · Husary', reciters: 'Recitations',

    if (key !== shownItem) { shownItem = key; shownAyah = ''; dlState = 'idle'; refreshDl(); }
    if (Listener.error()) { info.textContent = Listener.error(); }
    if (!it || it.kind !== 'quran') {
      if (it && it.quranSurah && ph !== 'ended') { text.className = 'artext'; text.textContent = surah(it.quranSurah).arabic; }   /* a reciter's surah: its name, large */
      else { text.className = 'artext none'; text.textContent = it ? (ph === 'ended' ? 'Finished' : '') : ''; }
    }
    if (ph === 'ended' && it && it.kind === 'quran') info.textContent = 'Finished';
    frame();
  }
  function refreshDl() {
    var it = Listener.item(); if (!it) { dl.textContent = ''; return; }
    var url = it.kind === 'quran' ? D.timings.murattal[String(it.queue[it.qi].s)].url : it.url;
    if (dlState === 'downloading') { dl.textContent = 'Downloading ' + Math.round(dlPct * 100) + '%'; return; }
    if (dlState === 'confirm') { dl.textContent = 'Remove download?'; return; }
    Offline.has(url).then(function (yes) { if (dlState === 'downloading' || dlState === 'confirm') return; dlState = yes ? 'have' : 'idle'; dl.textContent = yes ? 'Available offline' : 'Download for offline'; });
  }
  function onDl() {
    var it = Listener.item(); if (!it) return;
    var url = it.kind === 'quran' ? D.timings.murattal[String(it.queue[it.qi].s)].url : it.url;
    if (dlState === 'idle') {
      dlState = 'downloading'; dlPct = 0; refreshDl();
      Offline.download(url, function (p) { dlPct = p; refreshDl(); }).then(function () { dlState = 'have'; refreshDl(); }, function () { dlState = 'idle'; dl.textContent = 'Download failed — try again'; });
    } else if (dlState === 'have') { dlState = 'confirm'; refreshDl(); setTimeout(function () { if (dlState === 'confirm') { dlState = 'have'; refreshDl(); } }, 3000); }
    else if (dlState === 'confirm') { Offline.remove(url).then(function () { dlState = 'idle'; refreshDl(); }); }
  }
  function frame() {
    var it = Listener.item(); if (!it) return;
    var t = Listener.position(), d = Engine.duration();
    if (!scrubbing) fill.style.width = d ? Math.min(100, t / d * 100) + '%' : '0%';
    tl.textContent = mmss(t); tr.textContent = d ? '−' + mmss(Math.max(0, d - t)) : '';
    if (it.kind === 'quran' && Listener.phase() !== 'ended') {
      var q = it.queue[it.qi], v = D.timings.murattal[String(q.s)].v, ms = t * 1000, i = Planner.ayahAt(v, ms), a = i + 1, k = q.s + ':' + a;
      if (k !== shownAyah) { shownAyah = k; spans = renderWords(text, q.s, a, a, 1, D.words[String(q.s)][i].length, []); hl = { key: null, el: null }; }
      var p = Planner.wordAt(v[i], D.words[String(q.s)][i].length, ms);
      if (p) hl = highlight(spans, a, p, hl);
      if (!Listener.error()) info.textContent = surah(q.s).name + ' · Ayah ' + a + ' · Page ' + pageOf(q.s, a);
    }
  }
  function loop() { frame(); raf = requestAnimationFrame(loop); }
  return {
    id: 'player', title: opts.title || '', shortTitle: opts.title || 'Back', sub: ' ',
    build: function (body, p) {
      page = p;
      text = el('div', { class: 'artext', lang: 'ar' });
      body.classList.add('fill');
      body.appendChild(el('div', { class: 'ptext' }, [text]));
      info = el('div', { class: 'pinfo num' }); body.appendChild(info);
      fill = el('div', { class: 'fill' }); var track = el('div', { class: 'track' }, [fill]);
      tl = el('span', { text: '0:00' }); tr = el('span', { text: '' });
      var prog = el('div', { class: 'prog', 'aria-label': 'Progress' }, [track, el('div', { class: 'times' }, [tl, tr])]);
      function scrub(ev, commit) { var r = track.getBoundingClientRect(), f = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)); fill.style.width = (f * 100) + '%'; if (commit) { var d = Engine.duration(); if (d) Listener.seek(f * d); } }
      prog.addEventListener('pointerdown', function (ev) { scrubbing = true; try { prog.setPointerCapture(ev.pointerId); } catch (e) {} scrub(ev, false); });
      prog.addEventListener('pointermove', function (ev) { if (scrubbing) scrub(ev, false); });
      prog.addEventListener('pointerup', function (ev) { if (!scrubbing) return; scrubbing = false; scrub(ev, true); });
      prog.addEventListener('pointercancel', function () { scrubbing = false; });
      body.appendChild(prog);
      var it = Listener.item(), lecture = it && it.kind !== 'quran';
      playBtn = el('button', { class: 'play', 'aria-label': 'Play or pause', onclick: function () { Engine.unlock(); Listener.toggle(); } });
      body.appendChild(el('div', { class: 'transport' }, [
        el('button', { 'aria-label': lecture ? 'Back 15 seconds' : 'Previous ayah', onclick: function () { Listener.prev(); } }, [lecture ? ICON.back15() : ICON.prev()]),
        playBtn,
        el('button', { 'aria-label': lecture ? 'Forward 15 seconds' : 'Next ayah', onclick: function () { Listener.next(); } }, [lecture ? ICON.fwd15() : ICON.next()])
      ]));
      speedRow = el('div', { class: 'options show', role: 'group', 'aria-label': 'Speed' }); body.appendChild(speedRow);
      dl = el('button', { class: 'dl', onclick: onDl }); body.appendChild(dl);
      unsub = Listener.on(renderStatic);
      renderStatic();
      return {
        onShow: function () { renderStatic(); if (!raf) loop(); },
        onHide: function () { if (raf) cancelAnimationFrame(raf); raf = 0; },
        destroy: function () { if (unsub) unsub(); if (raf) cancelAnimationFrame(raf); raf = 0; }
      };
    }
  };
}

/* --- memorisation player --- */
function MemoPage() {
  var page, text, status, playBtn, options, pickers, spans = {}, hl = { key: null, el: null }, raf = 0, unsub = null, shownBlock = null, openPicker = null, countdown = null;
  var PICKERS = [
    { k: 'speed', label: 'Speed', values: QURAN_SPEEDS, fmt: speedLabel },
    { k: 'pause', label: 'Pause', values: PAUSES, fmt: speedLabel },
    { k: 'repeat', label: 'Repeat', values: REPEATS, fmt: function (v) { return v === 0 ? '∞' : String(v); } },
    { k: 'mode', label: 'Block', values: MODES.map(function (m) { return m[0]; }), fmt: modeLabel },
    { k: 'source', label: 'Source', values: SOURCES.map(function (m) { return m[0]; }), fmt: sourceLabel }
  ];
  function sub() { var s = surah(Memo.st.s); return 'Ayah ' + Memo.st.a + ' of ' + s.ayahs + ' · Page ' + pageOf(Memo.st.s, Memo.st.a) + ' · Juz ' + juzOf(Memo.st.s, Memo.st.a); }
  function renderPickers() {
    pickers.textContent = '';
    PICKERS.forEach(function (pk) {
      pickers.appendChild(el('button', { class: openPicker === pk.k ? 'open' : '', 'aria-label': pk.label, onclick: function () { openPicker = openPicker === pk.k ? null : pk.k; renderPickers(); renderOptions(); } }, [
        el('span', { class: 'lbl', text: pk.label }), el('span', { class: 'val num', text: pk.fmt(Memo.st[pk.k]) })
      ]));
    });
  }
  function renderOptions() {
    options.textContent = '';
    var pk = null; PICKERS.forEach(function (x) { if (x.k === openPicker) pk = x; });
    options.classList.toggle('show', !!pk);
    if (!pk) return;
    pk.values.forEach(function (v) {
      options.appendChild(el('button', { class: v === Memo.st[pk.k] ? 'on' : '', text: pk.fmt(v), onclick: function () { Engine.unlock(); Memo.set(pk.k, v); renderPickers(); renderOptions(); } }));
    });
  }
  function render() {
    var s = Memo.state(), b = s.block;
    page.setTitle(surah(Memo.st.s).name); page.setSub(sub());
    playBtn.textContent = ''; playBtn.appendChild(s.phase === 'playing' || s.phase === 'pausing' ? ICON.pause() : ICON.play());
    if (b) {
      var bk = b.s + '/' + b.a1 + ':' + b.w1 + '-' + b.a2 + ':' + b.w2 + '/' + b.k + '/' + b.n;
      if (bk !== shownBlock) { shownBlock = bk; spans = renderWords(text, b.s, b.a1, b.a2, b.w1, b.w2, b.lead); hl = { key: null, el: null }; }
    } else if (s.phase === 'done') { text.className = 'artext none'; text.textContent = 'You have reached Al-Fatihah. Everything is behind you.'; }
    text.classList.toggle('recite', s.phase === 'pausing');
    renderPickers();
    renderStatus();
    if (countdown) { clearInterval(countdown); countdown = null; }
    if (s.phase === 'pausing') countdown = setInterval(renderStatus, 200);
  }
  function renderStatus() {
    var s = Memo.state(), b = s.block; if (!b) { status.textContent = s.phase === 'done' ? 'Done' : ''; return; }
    var repTxt = Memo.st.repeat === 0 ? 'Repeat ' + s.rep : 'Repeat ' + s.rep + ' of ' + Memo.st.repeat;
    var blk = 'Block ' + b.k + ' of ' + b.n;
    if (s.error) { status.textContent = s.error; return; }
    if (s.phase === 'pausing') status.textContent = 'Recite · ' + Math.ceil(s.pauseLeft / 1000) + ' s · ' + blk;
    else if (s.phase === 'playing') status.textContent = blk + ' · ' + repTxt;
    else if (s.phase === 'done') status.textContent = 'Done';
    else status.textContent = blk + ' · ' + (b.a1 === b.a2 ? (b.partial ? 'words ' + b.w1 + '–' + b.w2 + ' of ayah ' + b.a1 : 'ayah ' + b.a1) : 'ayat ' + b.a1 + '–' + b.a2) + ' · ' + Math.round(b.dur / 1000) + ' s';
  }
  function frame() {
    var s = Memo.state(), b = s.block;
    if (b && s.phase === 'playing' && s.T) {
      var ms = Engine.time() * 1000, v = s.T[String(b.s)].v, i = b.a1 === b.a2 ? b.a1 - 1 : Math.min(b.a2 - 1, Math.max(b.a1 - 1, Planner.ayahAt(v, ms)));
      var p = Planner.wordAt(v[i], D.words[String(b.s)][i].length, ms);
      if (p) hl = highlight(spans, i + 1, p, hl);
    }
    raf = requestAnimationFrame(frame);
  }
  return {
    id: 'memo', title: surah(Memo.st.s).name, shortTitle: 'Memorise', sub: ' ', onSub: function () { Nav.push(PositionPage()); },
    build: function (body, p) {
      page = p; body.classList.add('fill');
      text = el('div', { class: 'artext', lang: 'ar' });
      body.appendChild(el('div', { class: 'ptext' }, [text]));
      status = el('div', { class: 'pinfo num' }); body.appendChild(status);
      playBtn = el('button', { class: 'play', 'aria-label': 'Play or pause', onclick: function () { Engine.unlock(); Memo.toggle(); } });
      body.appendChild(el('div', { class: 'transport' }, [
        el('button', { 'aria-label': 'Previous block', onclick: function () { Engine.unlock(); Memo.prev(); } }, [ICON.prev()]),
        playBtn,
        el('button', { 'aria-label': 'Next block', onclick: function () { Engine.unlock(); Memo.next(); } }, [ICON.next()])
      ]));
      options = el('div', { class: 'options', role: 'group' }); body.appendChild(options);
      pickers = el('div', { class: 'pickers' }); body.appendChild(pickers);
      unsub = Memo.on(render);
      Memo.ensurePlan().then(render, render);
      render();
      return {
        onShow: function () { Memo.ensurePlan().then(render, render); if (!raf) frame(); },
        onHide: function () { if (raf) cancelAnimationFrame(raf); raf = 0; },
        destroy: function () { if (unsub) unsub(); if (raf) cancelAnimationFrame(raf); raf = 0; if (countdown) clearInterval(countdown); }
      };
    }
  };
}

/* --- "I am learning" position picker: surahs from the back, ayah grid inline --- */
function PositionPage() {
  return {
    id: 'position', title: 'I am learning', shortTitle: 'Position', sub: 'Surah, then the ayah you are on. Surahs run from the back.',
    build: function (body) {
      var list = el('div', { class: 'list' }), open = Memo.st.s, grids = {}, rows = {};
      function grid(s) {
        var g = el('div', { class: 'ayahs' }), n = surah(s).ayahs, a;
        for (a = 1; a <= n; a++) g.appendChild(el('button', { class: (s === Memo.st.s && a === Memo.st.a) ? 'on' : '', text: String(a), onclick: (function (a) { return function () { Memo.setPosition(s, a, 1).then(function () { Nav.pop(); }); }; })(a) }));
        return g;
      }
      for (var n = 114; n >= 1; n--) {
        var s = surah(n);
        var row = el('button', { class: 'row', 'data-surah': n, onclick: (function (n) { return function () { toggle(n); }; })(n) }, [
          el('span', { class: 'n', text: String(n) }),
          el('span', { class: 'mid' }, [el('span', { class: 't', text: s.name }), el('span', { class: 's' }, [s.ayahs + ' ayat · page ' + s.page + ' · juz ' + s.juz])]),
          el('span', { class: 'arn', text: s.arabic, lang: 'ar' })
        ]);
        rows[n] = row; list.appendChild(row);
        if (n === open) { grids[n] = grid(n); list.appendChild(grids[n]); }
      }
      function toggle(n) {
        if (grids[open]) { list.removeChild(grids[open]); delete grids[open]; }
        if (open === n) { open = 0; return; }
        open = n; grids[n] = grid(n); list.insertBefore(grids[n], rows[n].nextSibling);
      }
      body.appendChild(list);
      return { onShow: function () { var r = rows[open]; if (r) body.scrollTop = Math.max(0, r.offsetTop - body.offsetTop - 8); } };
    }
  };
}

/* --- revision: four ranges relative to the position --- */
function RevisePage() {
  return {
    id: 'revise', title: 'Revise', shortTitle: 'Revise', sub: ' ', onSub: function () { Nav.push(PositionPage()); },
    build: function (body, page) {
      function render() {
        body.textContent = '';
        var S = Memo.st.s, A = Memo.st.a, P = pageOf(S, A), J = juzOf(S, A), P2 = Math.min(604, P + 4);
        page.setSub('Position ' + surah(S).name + ' · Ayah ' + A + ' · memorised from here to An-Nas');
        var pStart = parseKey(D.meta.pageStarts[P - 1]), pEnd = pageEnd(P2), jEnd = juzEnd(J);
        var choices = [
          { nm: 'Last 5 pages', df: ['Pages ' + P + '–' + P2 + ': from the first ayah of page ' + P + ' (', surah(pStart[0]).name + ' ' + pStart[1], ') to the end of page ' + P2 + ' (', surah(pEnd[0]).name + ' ' + pEnd[1], ')'], q: rangeQueue(pStart[0], pStart[1], pEnd[0], pEnd[1]) },
          { nm: 'Last surah', df: ['All of ', surah(S).name, ' · ' + surah(S).ayahs + ' ayat'], q: rangeQueue(S, 1, S, surah(S).ayahs) },
          { nm: 'Last juz', df: ['From ', surah(S).name + ' ' + A, ' to the end of Juz ' + J + ' (', surah(jEnd[0]).name + ' ' + jEnd[1], ')'], q: rangeQueue(S, A, jEnd[0], jEnd[1]) },
          { nm: 'Everything', df: ['From ', surah(S).name + ' ' + A, ' to An-Nas 6'], q: rangeQueue(S, A, 114, 6) }
        ];
        choices.forEach(function (c) {
          var df = el('span', { class: 'df num' });
          c.df.forEach(function (part, i) { df.appendChild(i % 2 ? el('b', { text: part }) : document.createTextNode(part)); });
          body.appendChild(el('button', { class: 'choice', onclick: function () {
            Engine.unlock();
            Listener.playQuran(c.q, { remember: false, album: 'Revision · ' + c.nm });
            Nav.push(PlayerPage({ title: surah(c.q[0].s).name }));
          } }, [el('span', { class: 'nm', text: c.nm }), df]));
        });
        body.appendChild(el('div', { class: 'hint', text: 'Continuous playback at your listening speed, no pauses.', style: 'margin-top:22px;font-size:15px;color:var(--faint)' }));
      }
      render();
      return { onShow: render };
    }
  };
}

/* --- collections (sharh / hadith / podcasts) and recitations --- */
function CollectionPage(id) {
  return {
    id: 'collection-' + id, title: TILES[id], shortTitle: TILES[id].length > 14 ? 'Back' : TILES[id], sub: ' ',
    build: function (body, page) {
      function render(c) {
        body.textContent = '';
        var avail = c.items.filter(function (it) { return it.url; }).length;
        page.setSub(avail === c.items.length ? c.items.length + ' items' : avail + ' of ' + c.items.length + ' available' + (c.note && avail === 0 ? ' · sample list' : ''));
        c.items.forEach(function (it, i) {
          var pos = store.get('pos.t.' + it.id, 0), sub = el('span', { class: 's' });
          if (!it.url) sub.textContent = 'Not yet available';
          else { sub.textContent = it.duration ? mmss(it.duration) : ''; if (pos > 3) { sub.appendChild(el('b', { text: (it.duration ? ' · ' : '') + 'resume at ' + mmss(pos) })); } }
          body.appendChild(el('button', { class: 'row' + (it.url ? '' : ' off'), disabled: it.url ? null : '', onclick: function () {
            if (!it.url) return; Engine.unlock();
            if (!Listener.playsTrack(it.id)) Listener.playTrack(it, { lecture: true, album: c.title, tile: id, startT: pos > 3 ? pos : 0 });
            Nav.push(PlayerPage({ title: it.title }));
          } }, [el('span', { class: 'n', text: String(i + 1) }), el('span', { class: 'mid' }, [el('span', { class: 't', text: it.title }), sub])]));
        });
        if (!c.items.length) body.appendChild(el('div', { class: 'empty', text: 'Nothing here yet.' }));
      }
      content(id).then(render, function () { body.appendChild(el('div', { class: 'empty', text: 'Could not load this list.' })); });
      return { onShow: function () { if (D.content[id]) render(D.content[id]); } };
    }
  };
}
function RecitersPage() {
  return {
    id: 'reciters', title: 'Recitations', shortTitle: 'Recitations', sub: 'Favourite reciter and surah pairs',
    build: function (body) {
      function render(c) {
        body.textContent = '';
        c.items.forEach(function (it) {
          var s = it.surah ? surah(it.surah) : null, pos = store.get('pos.t.' + it.id, 0), sub = el('span', { class: 's', text: it.reciter || '' });
          if (pos > 3) sub.appendChild(el('b', { text: ' · resume at ' + mmss(pos) }));
          body.appendChild(el('button', { class: 'row' + (it.url ? '' : ' off'), disabled: it.url ? null : '', onclick: function () {
            if (!it.url) return; Engine.unlock();
            if (!Listener.playsTrack(it.id)) Listener.playTrack({ id: it.id, url: it.url, title: it.title, artist: it.reciter, surah: it.surah }, { lecture: false, album: 'Recitations', tile: 'reciters', startT: pos > 3 ? pos : 0 });
            Nav.push(PlayerPage({ title: it.title }));
          } }, [
            el('span', { class: 'n', text: s ? String(s.n) : '' }),
            el('span', { class: 'mid' }, [el('span', { class: 't', text: it.title }), sub]),
            s ? el('span', { class: 'arn', text: s.arabic, lang: 'ar' }) : null
          ]));
        });
      }
      content('reciters').then(render, function () { body.appendChild(el('div', { class: 'empty', text: 'Could not load the list.' })); });
      return { onShow: function () { if (D.content.reciters) render(D.content.reciters); } };
    }
  };
}

/* ---------- boot ---------- */
function boot() {
  try { history.replaceState({ depth: 0 }, ''); } catch (e) {}
  document.addEventListener('touchend', function () { Engine.unlock(); }, { passive: true, once: true });
  document.addEventListener('click', function () { Engine.unlock(); }, { once: true });
  Promise.all([loadJSON('quran/meta.json'), loadJSON('quran/words.json'), timings('murattal')]).then(function (r) {
    D.meta = r[0]; D.words = r[1];
    Nav.push(HomePage());
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(function () {}); }
    window.MUSHAF = { Engine: Engine, Memo: Memo, Listener: Listener, Planner: Planner, Nav: Nav, store: store, D: D, Offline: Offline, openTile: openTile, ready: true };
    document.documentElement.setAttribute('data-ready', '1');
  }, function (err) {
    document.getElementById('stack').appendChild(el('div', { class: 'empty', style: 'padding-top:40vh', text: 'Could not load the Quran data. ' + (err && err.message ? err.message : '') }));
  });
}
boot();
})();
