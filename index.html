<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070C">
<link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="icon" href="./icon-192.png">
<title>Mushaf</title>
<style>
html{background:#05070C}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
     font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:#F2F5FA;
     background:linear-gradient(180deg,#05070C,#0A0F1A)}
main{padding:32px 24px;max-width:420px;width:100%}
img{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 22px}
h1{font-weight:600;font-size:22px;text-align:center;margin:0 0 6px;letter-spacing:-.01em}
p{color:rgba(238,243,252,.5);text-align:center;font-size:14px;margin:0 0 28px;line-height:1.5}
a{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;margin-top:10px;border-radius:16px;
  background:rgba(255,255,255,.042);border:1px solid rgba(255,255,255,.085);color:inherit;text-decoration:none;font-size:16px}
a span{color:rgba(238,243,252,.46);font-size:13px}
a.off{opacity:.38;pointer-events:none}
</style></head><body><main>
<img src="./icon-192.png" alt="">
<h1>Mushaf</h1>
<p>Three prototypes are being built. Each appears here as soon as it is finished.</p>
<a id="a" class="off" href="./preview/a/">A · Tiles and sheets <span>not yet</span></a>
<a id="b" class="off" href="./preview/b/">B · Typographic stack <span>not yet</span></a>
<a id="c" class="off" href="./preview/c/">C · Now playing first <span>not yet</span></a>
<script>
['a','b','c'].forEach(function(k){
  fetch('./preview/'+k+'/index.html',{method:'HEAD',cache:'no-store'}).then(function(r){
    if(r.ok){var el=document.getElementById(k);el.className='';el.querySelector('span').textContent='open';}
  }).catch(function(){});
});
</script>
</main></body></html>
