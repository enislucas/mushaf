<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mushaf</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mushaf">
<meta name="theme-color" content="#05070C">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<style>
:root {
  --ink0: #05070C; --ink1: #0A0F1A;
  --accent: #8AAEFF;
  --hair: rgba(255,255,255,.075);
  --card: rgba(255,255,255,.042); --cardb: rgba(255,255,255,.085);
  --t1: rgba(255,255,255,.92); --t2: rgba(255,255,255,.55); --t3: rgba(255,255,255,.32);
  --sheet: rgba(16,21,33,.94);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --strip: calc(64px + var(--sab));
  --ease: cubic-bezier(.22,.8,.2,1);
  --ar: "KFGQPC Uthman Taha Naskh", "Amiri", "Scheherazade New", "Noto Naskh Arabic", "Geeza Pro", serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--ink0); height: 100%; overscroll-behavior: none; }
body {
  margin: 0; position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%;
  height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none;
  background: linear-gradient(180deg, var(--ink0) 0%, var(--ink1) 100%);
  color: var(--t1);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.3; -webkit-font-smoothing: antialiased;
  touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; -webkit-appearance: none; appearance: none; }
button:focus { outline: none; }
input { font: inherit; }
.num, .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.ar { font-family: var(--ar); }
[hidden] { display: none !important; }

/* ---------- home ---------- */
#home {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column;
  padding: calc(var(--sat) + 10px) calc(16px + var(--sar)) calc(var(--sab) + 14px) calc(16px + var(--sal));
  transition: transform .45s var(--ease), opacity .45s var(--ease), padding-bottom .35s var(--ease);
  transform-origin: 50% 0;
}
body.strip #home { padding-bottom: calc(var(--strip) + 14px); }
body.editing #home { padding-bottom: calc(var(--sab) + 196px); }
body.pfull #home { transform: scale(.94) translateY(-4px); opacity: .45; }
.top { display: flex; align-items: baseline; justify-content: space-between; height: 44px; flex: none; transition: opacity .3s; }
body.pfull .top { opacity: 0; }
.top h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .01em; color: var(--t1); }
.top .sub { font-size: 15px; color: var(--t3); margin-left: 10px; font-weight: 400; }
#done { color: var(--accent); font-weight: 600; font-size: 17px; padding: 6px 0 6px 16px; }
#grid { position: relative; flex: 1; min-height: 0; touch-action: none; }
#hint { flex: none; margin: 10px 0 0; text-align: center; font-size: 15px; color: var(--t3); height: 20px; transition: opacity .3s; }

.tile { position: absolute; left: 0; top: 0; width: 100px; height: 100px; transition: transform .38s var(--ease), width .38s var(--ease), height .38s var(--ease), opacity .3s; will-change: transform; }
.tin {
  position: relative; width: 100%; height: 100%; border-radius: 26px; padding: 18px 18px 16px;
  background: var(--card); border: 1px solid var(--cardb);
  background-image: radial-gradient(120% 70% at 18% 0%, rgba(255,255,255,.055), rgba(255,255,255,0) 62%);
  -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
  display: flex; flex-direction: column; justify-content: space-between;
  transition: transform .22s var(--ease), box-shadow .22s var(--ease), border-color .3s;
}
.tile.press .tin { transform: scale(.965); }
.tname { font-size: 20px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; color: var(--t1); }
.tstat { font-size: 15px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.tile.live .tstat { color: var(--accent); }
.rm { position: absolute; top: -8px; left: -8px; width: 30px; height: 30px; border-radius: 50%; background: #1B2234; border: 1px solid rgba(255,255,255,.14); color: var(--t1); display: none; align-items: center; justify-content: center; z-index: 2; touch-action: manipulation; }
.rm::before { content: ""; width: 12px; height: 2px; background: currentColor; border-radius: 1px; }
.editing .rm { display: flex; }
.ghost { position: absolute; left: 0; top: 0; border-radius: 26px; border: 1px dashed rgba(255,255,255,.14); opacity: 0; transition: opacity .3s, transform .38s var(--ease), width .38s var(--ease), height .38s var(--ease); pointer-events: none; }
.editing .ghost { opacity: 1; }
.tile.drag { transition: none; z-index: 5; }
.tile.drag .tin { transform: scale(1.06); box-shadow: 0 18px 40px rgba(0,0,0,.55); border-color: rgba(255,255,255,.2); animation: none !important; }
@keyframes wiggle { from { transform: rotate(-1.3deg); } to { transform: rotate(1.3deg); } }
.editing .tile .tin { animation: wiggle .26s ease-in-out infinite alternate; }
.editing .tile:nth-child(odd) .tin { animation-delay: -.13s; }
.editing .tile.pressdrag .tin { animation: none; }

/* ---------- sheets ---------- */
#scrim { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 50; }
#scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--sheet); -webkit-backdrop-filter: blur(40px); backdrop-filter: blur(40px);
  border-top: 1px solid rgba(255,255,255,.1); border-radius: 22px 22px 0 0;
  transform: translate3d(0, 105%, 0); transition: transform .42s var(--ease);
  display: flex; flex-direction: column; will-change: transform;
  padding-left: var(--sal); padding-right: var(--sar);
}
.sheet.open { transform: translate3d(0, 0, 0); }
.sheet.peek { transform: translate3d(0, calc(100% - var(--strip)), 0); }
.sheet.content { z-index: 60; max-height: calc(100% - var(--sat) - 44px); }
.sheet.content.tall { height: calc(100% - var(--sat) - 44px); }
.sheet.edit { z-index: 30; background: rgba(12,17,28,.96); }
.sheet.player { z-index: 40; height: calc(100% - var(--sat) - 12px); }
.grab { flex: none; width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.22); margin: 8px auto 4px; }
.sh-head { flex: none; padding: 6px 16px 10px; touch-action: none; }
.sh-title { display: flex; align-items: center; justify-content: space-between; min-height: 36px; }
.sh-title h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.sh-title .sub { font-size: 15px; color: var(--t2); margin-top: 2px; }
.sh-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; padding-bottom: calc(var(--sab) + 18px); }
.chip { font-size: 15px; font-weight: 600; color: var(--accent); background: rgba(138,174,255,.12); border-radius: 999px; padding: 8px 14px; touch-action: manipulation; }
.txtbtn { font-size: 15px; font-weight: 600; color: var(--accent); padding: 8px 0 8px 12px; touch-action: manipulation; white-space: nowrap; }
.txtbtn.quiet { color: var(--t3); font-weight: 500; }
.search { display: block; width: 100%; height: 40px; margin-top: 10px; border-radius: 12px; border: 0; background: rgba(255,255,255,.07); color: var(--t1); font-size: 17px; padding: 0 14px; -webkit-appearance: none; appearance: none; -webkit-user-select: text; user-select: text; }
.search::placeholder { color: var(--t3); }
.search:focus { outline: none; background: rgba(255,255,255,.1); }

/* list rows */
.sec { position: -webkit-sticky; position: sticky; top: 0; z-index: 1; background: var(--sheet); font-size: 15px; font-weight: 600; color: var(--t3); padding: 12px 16px 6px; text-transform: none; letter-spacing: .02em; }
.sec span { color: var(--t2); }
.row { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; min-height: 58px; padding: 8px 16px; width: 100%; text-align: left; border-bottom: 1px solid var(--hair); }
.row:active { background: rgba(255,255,255,.04); }
.row .n { font-size: 17px; color: var(--t2); font-weight: 300; }
.row .names { display: flex; align-items: baseline; justify-content: space-between; min-width: 0; padding-right: 14px; }
.row .lat { font-size: 17px; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .arn { font-size: 21px; color: var(--t1); line-height: 1.1; margin-left: 10px; font-family: var(--ar); }
.row .meta { font-size: 15px; color: var(--t2); text-align: right; white-space: nowrap; }
.row .meta b { font-weight: 400; color: var(--t3); }
.row.cont .lat { color: var(--t2); }
.row .dl { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; margin-left: 8px; opacity: .7; vertical-align: middle; }
.row.item { grid-template-columns: 1fr auto; min-height: 62px; }
.row.item .t1 { font-size: 17px; color: var(--t1); }
.row.item .t2 { font-size: 15px; color: var(--t2); margin-top: 2px; }
.row.item.na { opacity: .45; }
.row.item .side { display: flex; align-items: center; }
.row.item .side .txtbtn { padding: 8px 0 8px 14px; }
.empty { padding: 24px 16px; color: var(--t3); font-size: 15px; text-align: center; }

/* revision choices */
.choice { display: block; width: 100%; text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--hair); }
.choice:active { background: rgba(255,255,255,.04); }
.choice .c1 { display: flex; justify-content: space-between; align-items: baseline; font-size: 17px; font-weight: 600; }
.choice .c1 .rng { font-weight: 400; color: var(--accent); font-size: 15px; }
.choice .c2 { font-size: 15px; color: var(--t2); margin-top: 3px; }

/* ayah grid (position picker) */
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); grid-gap: 8px; gap: 8px; padding: 6px 16px 16px; }
.agrid button { height: 46px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.06); font-size: 17px; font-weight: 300; color: var(--t1); }
.agrid button.cur { background: rgba(138,174,255,.18); border-color: rgba(138,174,255,.4); color: var(--accent); font-weight: 500; }
.back { display: flex; align-items: center; font-size: 17px; color: var(--accent); padding: 4px 0; }
.back::before { content: ""; width: 9px; height: 9px; border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); margin: 0 10px 0 2px; }

/* segmented control */
.seg { display: flex; background: rgba(255,255,255,.06); border-radius: 10px; padding: 2px; }
.seg button { flex: 1; min-width: 0; height: 32px; border-radius: 8px; font-size: 15px; color: var(--t2); font-weight: 500; transition: background .2s, color .2s; }
.seg button.on { background: rgba(255,255,255,.14); color: var(--t1); }
.srow { display: grid; grid-template-columns: 78px 1fr; align-items: center; min-height: 46px; padding: 0 16px; }
.srow .slab { font-size: 15px; color: var(--t2); }
.switch { position: relative; width: 51px; height: 31px; border-radius: 16px; background: rgba(255,255,255,.14); transition: background .25s; justify-self: end; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease); box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(20px); }

/* edit bar */
.edit .sh-head { padding-top: 4px; }
.chips { display: flex; flex-wrap: wrap; padding: 4px 16px 0; }
.chips .chip { display: inline-flex; align-items: center; margin: 0 8px 8px 0; color: var(--t1); background: rgba(255,255,255,.08); font-weight: 500; }
.chips .chip::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--accent); margin-right: 8px; position: relative; background: linear-gradient(var(--accent), var(--accent)) center/8px 1.5px no-repeat, linear-gradient(var(--accent), var(--accent)) center/1.5px 8px no-repeat; }
.chips .chip.off { opacity: .35; }
.editnote { padding: 0 16px 6px; font-size: 15px; color: var(--t3); }

/* ---------- player ---------- */
.player .strip { position: absolute; top: 0; left: 0; right: 0; height: var(--strip); padding: 0 8px var(--sab) 18px; display: flex; align-items: center; touch-action: none; transition: opacity .25s; }
.player.open .strip { opacity: 0; pointer-events: none; }
.sprog { position: absolute; top: -1px; left: 22px; right: 22px; height: 2px; background: rgba(255,255,255,.1); border-radius: 1px; overflow: hidden; }
.sprog div { height: 100%; width: 0; background: var(--accent); }
.stxt { flex: 1; min-width: 0; }
.st1 { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st2 { font-size: 15px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.ibtn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--t1); border-radius: 50%; touch-action: manipulation; }
.ibtn svg { width: 22px; height: 22px; fill: currentColor; }
.ibtn.x { color: var(--t2); }
.player .full { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; opacity: 0; transition: opacity .3s; }
.player.open .full { opacity: 1; }
.player.peek .full { pointer-events: none; }
.ph { display: flex; align-items: flex-start; justify-content: space-between; padding: 6px 16px 8px; touch-action: none; flex: none; }
.kicker { font-size: 15px; color: var(--t2); }
.ptitle { display: block; text-align: left; font-size: 22px; font-weight: 600; letter-spacing: -.01em; margin-top: 2px; line-height: 1.2; }
.ptitle.link::after { content: ""; display: inline-block; width: 8px; height: 8px; border-right: 2px solid var(--t3); border-top: 2px solid var(--t3); transform: rotate(45deg); margin: 0 0 3px 10px; }
.mtext { font-family: var(--ar); direction: rtl; text-align: center; font-size: 32px; line-height: 1.95; padding: 6px 20px 2px; min-height: 130px; color: var(--t1); word-spacing: .12em; transition: filter .3s, opacity .3s; }
.player.listen .mtext { font-size: 27px; line-height: 1.9; min-height: 110px; }
.mtext .w { display: inline; transition: color .12s; }
.mtext .w.todo { color: rgba(255,255,255,.5); }
.mtext .w.cur { color: var(--accent); }
.mtext .sign { color: var(--t3); font-size: .8em; margin: 0 .25em; }
.mtext.veil { filter: blur(9px); opacity: .55; }
.cap { text-align: center; font-size: 15px; color: var(--t2); margin-top: 10px; }
.stat { text-align: center; font-size: 15px; color: var(--t1); margin-top: 6px; min-height: 20px; }
.stat.recite { color: var(--accent); }
.prog { position: relative; height: 24px; margin: 10px 24px 0; touch-action: none; }
.prog::before { content: ""; position: absolute; top: 11px; left: 0; right: 0; height: 2px; background: rgba(255,255,255,.1); border-radius: 1px; }
.prog .bar { position: absolute; top: 11px; left: 0; height: 2px; width: 0; background: var(--accent); border-radius: 1px; }
.prog .drain { position: absolute; top: 11px; left: 0; height: 2px; width: 0; background: var(--t2); border-radius: 1px; }
.times { display: flex; justify-content: space-between; margin: -4px 24px 0; font-size: 15px; color: var(--t3); }
.ctl { display: flex; align-items: center; justify-content: center; margin: 14px 0 12px; }
.ctl .ibtn { width: 64px; height: 64px; color: var(--t1); }
.ctl .ibtn svg { width: 30px; height: 30px; }
.ctl .ibtn.step { font-size: 17px; font-weight: 500; color: var(--t1); }
.ctl .big { width: 76px; height: 76px; border-radius: 50%; background: var(--accent); color: var(--ink0); margin: 0 28px; display: flex; align-items: center; justify-content: center; transition: transform .15s; }
.ctl .big:active { transform: scale(.94); }
.ctl .big svg { width: 32px; height: 32px; fill: currentColor; }
.player .settings { padding-top: 6px; border-top: 1px solid var(--hair); margin: 6px 16px 0; }
.player .settings .srow { padding: 0; }
.pmsg { text-align: center; font-size: 15px; color: var(--t2); padding: 6px 20px; min-height: 22px; }
.pmsg.err { color: #FFB4A8; }

@media (prefers-reduced-motion: reduce) {
  .sheet, #home, .tile, .ghost, .tin, #scrim { transition: none !important; }
  .editing .tile .tin { animation: none !important; border-style: dashed; }
  .switch::after { transition: none; }
}
@media (max-height: 700px) { .mtext { font-size: 28px; min-height: 100px; } .ctl { margin: 6px 0 4px; } }
</style>
</head>
<body>
<main id="home">
  <header class="top"><h1>Mushaf<span class="sub" id="topSub"></span></h1><button id="done" hidden>Done</button></header>
  <div id="grid"></div>
  <p id="hint">Hold a tile to edit</p>
</main>

<section id="editbar" class="sheet edit">
  <div class="grab"></div>
  <div class="sh-head">
    <div class="sh-title"><h2>Tiles</h2><div class="seg" id="sizeSeg" style="width:170px"><button data-v="4">4</button><button data-v="6">6</button></div></div>
  </div>
  <div class="chips" id="inactive"></div>
  <div class="editnote" id="editnote"></div>
</section>

<div id="scrim"></div>

<section id="player" class="sheet player">
  <div class="strip" id="strip">
    <div class="sprog"><div id="sProg"></div></div>
    <div class="stxt"><div class="st1" id="sT1"></div><div class="st2 tnum" id="sT2"></div></div>
    <button class="ibtn" id="sPlay" aria-label="Play"></button>
    <button class="ibtn x" id="sClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6.2 4.8 12 10.6l5.8-5.8 1.4 1.4L13.4 12l5.8 5.8-1.4 1.4L12 13.4l-5.8 5.8-1.4-1.4L10.6 12 4.8 6.2z"/></svg></button>
  </div>
  <div class="full">
    <div class="grab"></div>
    <div class="ph">
      <div style="min-width:0"><div class="kicker" id="pKick"></div><button class="ptitle" id="pTitle"></button></div>
      <button class="txtbtn quiet" id="pDl"></button>
    </div>
    <div class="sh-body">
      <div class="mtext" id="pText" dir="rtl" lang="ar"></div>
      <div class="cap tnum" id="pCap"></div>
      <div class="stat tnum" id="pStat"></div>
      <div class="prog" id="pProg"><div class="bar" id="pBar"></div><div class="drain" id="pDrain"></div></div>
      <div class="times tnum"><span id="pT1"></span><span id="pT2"></span></div>
      <div class="ctl">
        <button class="ibtn" id="pPrev" aria-label="Previous"></button>
        <button class="big" id="pPlay" aria-label="Play"></button>
        <button class="ibtn" id="pNext" aria-label="Next"></button>
      </div>
      <div class="pmsg" id="pMsg"></div>
      <div class="settings" id="pSet"></div>
    </div>
  </div>
</section>

<section id="sheet" class="sheet content">
  <div class="grab"></div>
  <div class="sh-head" id="shHead"></div>
  <div class="sh-body" id="shBody"></div>
</section>

<script>
'use strict';
var BASE = '../../';   // integrator: './'

/* =========================================================================
   storage, helpers
   ========================================================================= */
var LS = 'mushaf.';
function lsGet(k, d) { try { var v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} }
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function fmt(sec) { sec = Math.max(0, Math.round(sec || 0)); var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (s < 10 ? '0' : '') + s; }
function arDigits(n) { return String(n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
var SVG = {
  play: '<svg viewBox="0 0 24 24"><path d="M7 4.5v15c0 .8.9 1.3 1.6.9l12-7.5c.6-.4.6-1.4 0-1.8l-12-7.5C7.9 3.2 7 3.7 7 4.5z"/></svg>',

        var where = b.a1 === b.a2 ? 'Ayah ' + b.a1 : 'Ayat ' + b.a1 + '–' + b.a2;
        cap.textContent = 'Surah ' + b.s + ' · ' + where + (b.parts > 1 ? ' · part ' + b.part + ' of ' + b.parts : '') + ' · Page ' + Q.pageOf(b.s, b.a1);
        var rep = m.repeat === 'inf' ? 'repeat ' + ses.rep + ' · ∞' : 'repeat ' + ses.rep + ' of ' + m.repeat;
        if (ses.st === 'pausing') { lastRecite = -1; recite(ses.pauseEnd - Date.now()); stat.className = 'stat tnum recite'; }
        else { stat.textContent = 'Block ' + (b.i + 1) + ' of ' + b.n + ' · ' + rep + (ses.st === 'loading' ? ' · loading' : ses.st === 'paused' ? ' · paused' : ''); stat.className = 'stat tnum'; }
        sT1.textContent = su.name + ' · ' + where; sT2.textContent = ses.st === 'pausing' ? 'Recite' : 'Memorise · block ' + (b.i + 1) + ' of ' + b.n;
        veiled = ses.st === 'pausing' && m.hide; text.classList.toggle('veil', veiled);
        if (ses.st !== 'playing') progress(ses.st === 'pausing' ? 0 : 0, ses.st === 'pausing' ? 1 : 0);
        if (ses.st === 'done') { stat.textContent = 'Finished'; }
      } else { cap.textContent = ''; stat.textContent = ses.st === 'loading' ? 'Loading…' : ''; sT1.textContent = su.name; sT2.textContent = 'Memorise'; }
      mediaSession({ title: su.name + ' · ' + m.s + ':' + m.a, artist: 'Memorise · Husary' }, {
        play: function () { ses.resume(); }, pause: function () { ses.pause(); }, previoustrack: function () { ses.prev(); }, nexttrack: function () { ses.next(); }
      });
    } else {
      var o = ses.o;
      title.classList.remove('link');
      if (o.kind === 'quran') {
        bPrev.innerHTML = SVG.prev; bNext.innerHTML = SVG.next; bPrev.className = 'ibtn'; bNext.className = 'ibtn';
        if (ses.ai < 0) { var su2 = Q.surah(ses.s); kick.textContent = o.label || 'Husary'; title.textContent = su2.name + '  ' + su2.arabic; sT1.textContent = su2.name; sT2.textContent = o.label || 'Husary'; cap.textContent = ses.st === 'loading' ? 'Loading…' : ''; }
        stat.textContent = ses.finished ? 'Finished' : (o.sub && o.endS != null ? o.sub : (ses.st === 'paused' ? 'Paused' : ''));
        stat.className = 'stat tnum';
      } else {
        kick.textContent = o.sub || ''; title.textContent = o.title; sT1.textContent = o.title; sT2.textContent = o.sub || '';
        bPrev.innerHTML = '−15'; bNext.innerHTML = '+15'; bPrev.className = 'ibtn step tnum'; bNext.className = 'ibtn step tnum';
        text.innerHTML = ''; wordEls = []; text.dataset.key = '';
        cap.textContent = ''; stat.textContent = ses.finished ? 'Finished' : ses.st === 'loading' ? 'Loading…' : ses.st === 'paused' ? 'Paused' : ''; stat.className = 'stat tnum';
      }
      text.classList.remove('veil'); veiled = false;
    }
    paintDl();
  }

  UI.player = { attach: attach, show: show, render: render, highlight: highlight, progress: progress, times: times, recite: recite, ayah: ayah, msg: setMsg, hideForEdit: hideForEdit, close: closePlayer, sheet: sh };
})();

   boot
   ========================================================================= */
var ready = loadCore().then(function () {
  if (lsGet('layout', null) === null) lsSet('layout', state.layout);
  UI.grid.render();
  return Promise.all([DL.init()].concat(['reciters', 'sharh', 'hadith', 'podcasts'].map(function (k) { return loadContent(k).catch(function () {}); })));
}).then(function () { UI.grid.statuses(); return true; }).catch(function (e) {
  $('#hint').textContent = 'Could not load the Quran data.'; $('#hint').style.opacity = '1'; throw e;
});
window.__mushaf = { ready: ready, state: state, get active() { return active; }, audio: audio, Q: Q, planSurah: planSurah, UI: UI, DL: DL, Engine: Engine };

if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
